<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>하스트수리의 삶</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f1419;
      color: #f5f6fa;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 1120px;
      aspect-ratio: 16 / 9;
      max-height: 94dvh;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background-color: #1e272e;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #hud-top {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 5;
    }

    .hud-group {
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(15, 20, 25, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #a4b0be;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }

    .bar-track {
      width: 110px;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    #playerHpBar {
      width: 100%;
      height: 100%;
      background: #ff4757;
      border-radius: 4px;
      transition: width 0.15s ease;
    }

    #playerOxygenBar {
      width: 100%;
      height: 100%;
      background: #1e90ff;
      border-radius: 4px;
      transition: width 0.15s ease;
    }

    .info-pill {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f1f2f6;
      padding: 0 6px;
    }

    #help-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #help-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    #touch-controls {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      z-index: 5;
      opacity: 0.75;
      transition: opacity 0.2s;
    }

    #touch-controls:hover {
      opacity: 1;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(2, 40px);
      gap: 4px;
    }

    .ctrl-btn {
      background: rgba(15, 20, 25, 0.65);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .ctrl-btn:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }

    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    #btn-attack {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255, 165, 2, 0.28);
      backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255, 165, 2, 0.7);
      color: #ffa502;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #btn-attack:active {
      background: rgba(255, 165, 2, 0.5);
      transform: scale(0.94);
    }

    #start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 18, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }

    #overlay-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a4b0be;
      margin: 0 0 22px 0;
    }

    .simple-guide {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 18px 26px;
      margin-bottom: 24px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 1rem;
      line-height: 1.45;
    }

    .guide-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .guide-badge {
      background: rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      color: #ffa502;
      min-width: 72px;
      text-align: center;
    }

    #start-btn {
      padding: 12px 42px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f1419;
      background-color: #ffa502;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 165, 2, 0.35);
      transition: transform 0.15s, background-color 0.15s;
    }

    #start-btn:hover {
      background-color: #ffb142;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <canvas id="gameCanvas" width="1024" height="576"></canvas>

    <div id="hud-top">
      <div class="hud-group">
        <div class="stat-item">
          <div class="stat-label"><span>체력</span><span id="hpNumText">100</span></div>
          <div class="bar-track"><div id="playerHpBar"></div></div>
        </div>
        <div class="stat-item">
          <div class="stat-label"><span>산소</span><span id="oxyNumText">100</span></div>
          <div class="bar-track"><div id="playerOxygenBar"></div></div>
        </div>
      </div>

      <div class="hud-group">
        <span class="info-pill" id="terrainText">🌲 숲</span>
        <span class="info-pill" id="timeStateText">☀️ 낮</span>
        <span class="info-pill">점수 <strong id="scoreText" style="color: #ffa502;">0</strong></span>
        <button id="help-btn" onclick="openHelp()">?</button>
      </div>
    </div>

    <div id="touch-controls">
      <div class="dpad">
        <div class="ctrl-btn" id="btn-up">W</div>
        <div class="ctrl-btn" id="btn-left">A</div>
        <div class="ctrl-btn" id="btn-down">S</div>
        <div class="ctrl-btn" id="btn-right">D</div>
      </div>
      <div id="btn-attack">🦅<br>발톱 공격</div>
    </div>

    <div id="start-overlay">
      <h1 id="overlay-title">🦅 하스트수리의 삶</h1>
      <p class="subtitle">하늘의 제왕 하스트수리가 되어 살아남으세요</p>

      <div class="simple-guide">
        <div class="guide-row">
          <span class="guide-badge">움직이기</span>
          <span><b>W, A, S, D</b> 키 (또는 화살표 키)로 날아다녀요.</span>
        </div>
        <div class="guide-row">
          <span class="guide-badge">사냥·공격</span>
          <span><b>켈렌불라레와 작은 동물</b>은 부딪혀서 먹고, 큰 공룡은 <b>스페이스바(발톱 공격)</b>로 물리쳐요.</span>
        </div>
        <div class="guide-row">
          <span class="guide-badge">숨쉬기·둥지</span>
          <span><b>물</b>에 들어가면 산소가 줄어드니 <b>숲</b>으로 나오고, <b>알 둥지</b>에 가면 아기 새가 태어나요!</span>
        </div>
      </div>

      <button id="start-btn" onclick="handleStartOrResume()">게임 시작</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const terrainText = document.getElementById("terrainText");
    const timeStateText = document.getElementById("timeStateText");
    const scoreText = document.getElementById("scoreText");
    const playerHpBar = document.getElementById("playerHpBar");
    const playerOxygenBar = document.getElementById("playerOxygenBar");
    const hpNumText = document.getElementById("hpNumText");
    const oxyNumText = document.getElementById("oxyNumText");
    const startOverlay = document.getElementById("start-overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const startBtn = document.getElementById("start-btn");

    const x = 1.0;

    const MAP_WIDTH = 5000;
    const MAP_HEIGHT = 3200;

    const RIVER_START = 1950;
    const RIVER_END = 2450;
    const OCEAN_START = 3400;

    const KELENVOLARE_LIFESPAN = 180000; // 켈렌불라레 수명: 3분 (180,000ms)

    const camera = { x: 0, y: 0, width: canvas.width, height: canvas.height };

    let score = 0;
    let gameStartTime = 0;
    let isGameRunning = false;
    let isPausedForHelp = false;
    let spawnIntervalId = null;

    let playerHp = 100;
    const MAX_HP = 100;
    let playerOxygen = 100;
    const MAX_OXYGEN = 100;

    const player = {
      x: 1500, y: 1600, width: 85, height: 70, speed: 6.5, angle: 0,
      species: "하스트수리", gender: "♂", hitCooldown: 0,
      clawTimer: 0, clawCooldown: 0
    };

    const keys = {};
    let clawEffects = [];
    let entities = [];
    let nests = [];
    let hasBabySpawned = false;

    window.addEventListener("keydown", (e) => {
      const code = e.code;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "KeyW", "KeyA", "KeyS", "KeyD"].includes(code)) {
        e.preventDefault();
      }
      keys[code] = true;

      if (code === "Space" && isGameRunning) {
        triggerClawAttack();
      }
    });
    
    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    function setupTouchButton(buttonId, keyCode) {
      const btn = document.getElementById(buttonId);
      const press = (e) => { e.preventDefault(); keys[keyCode] = true; };
      const release = (e) => { e.preventDefault(); keys[keyCode] = false; };
      btn.addEventListener("touchstart", press, { passive: false });
      btn.addEventListener("touchend", release, { passive: false });
      btn.addEventListener("mousedown", press);
      btn.addEventListener("mouseup", release);
      btn.addEventListener("mouseleave", release);
    }

    setupTouchButton("btn-up", "KeyW");
    setupTouchButton("btn-down", "KeyS");
    setupTouchButton("btn-left", "KeyA");
    setupTouchButton("btn-right", "KeyD");

    document.getElementById("btn-attack").addEventListener("click", () => {
      if (isGameRunning) triggerClawAttack();
    });

    function openHelp() {
      if (!isGameRunning) return;
      isPausedForHelp = true;
      isGameRunning = false;
      overlayTitle.innerText = "🦅 게임 방법";
      startBtn.innerText = "계속하기";
      startOverlay.style.display = "flex";
    }

    function handleStartOrResume() {
      if (isPausedForHelp) {
        isPausedForHelp = false;
        isGameRunning = true;
        startOverlay.style.display = "none";
      } else {
        startGame();
      }
    }

    function isOceanArea(px, py, width = 0) {
      return (px + width >= OCEAN_START);
    }

    function isRiverArea(px, py, width = 0) {
      return (px + width >= RIVER_START && px <= RIVER_END);
    }

    function isWaterArea(px, py, width = 0) {
      return isOceanArea(px, py, width) || isRiverArea(px, py, width);
    }

    function triggerClawAttack() {
      if (player.clawCooldown > 0) return;

      player.clawTimer = 14;
      player.clawCooldown = 28;

      const pCenterX = player.x + player.width / 2;
      const pCenterY = player.y + player.height / 2;
      const hitX = pCenterX + Math.cos(player.angle) * 55;
      const hitY = pCenterY + Math.sin(player.angle) * 55;

      clawEffects.push({
        x: hitX,
        y: hitY,
        angle: player.angle,
        life: 14,
        maxLife: 14
      });

      for (let i = entities.length - 1; i >= 0; i--) {
        const e = entities[i];
        if (e.species === "하스트수리") continue;

        const eCenterX = e.x + e.width / 2;
        const eCenterY = e.y + e.height / 2;
        const dist = Math.hypot(hitX - eCenterX, hitY - eCenterY);

        if (dist < Math.max(e.width, e.height) * 0.55 + 50) {
          e.hp -= 45;
          e.x += Math.cos(player.angle) * 35;
          e.y += Math.sin(player.angle) * 35;

          if (!e.isTarget) {
            e.chaseState = "CHASING";
            e.chaseTimer = Date.now();
          }

          if (e.hp <= 0) {
            if (e.species === "켈렌불라레") {
              score += e.isBaby ? 2 : 4;
            } else {
              score += e.isTarget ? 1 : 5;
            }
            scoreText.innerText = score;
            if (e.isTarget) {
              playerHp = Math.min(MAX_HP, playerHp + 20);
              playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 25);
            }
            entities.splice(i, 1);
          }
        }
      }
    }

    function initNests() {
      nests = [
        { id: 0, x: 600, y: 700, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" },
        { id: 1, x: 1300, y: 1500, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" },
        { id: 2, x: 900, y: 2500, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" },
        { id: 3, x: 2950, y: 900, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" }
      ];
    }

    function startGame() {
      score = 0;
      gameStartTime = Date.now();
      playerHp = MAX_HP;
      playerOxygen = MAX_OXYGEN;
      isGameRunning = true;
      isPausedForHelp = false;
      hasBabySpawned = false;
      entities = [];
      clawEffects = [];
      player.x = 1500;
      player.y = 1600;
      player.hitCooldown = 0;
      player.clawTimer = 0;
      player.clawCooldown = 0;

      scoreText.innerText = score;
      updateStatusBars();
      startBtn.innerText = "다시 시작";
      startOverlay.style.display = "none";

      initNests();
      spawnHaastEagleFemale();
      spawnHaastEagleBaby(Math.PI);

      // 초기 켈렌불라레 배치 (성체와 새끼가 다양한 나이대로 시작하도록 설정)
      spawnKelenvolare("♀", false, 1280, 1400, 60000);
      spawnKelenvolare("♂", false, 1360, 1440, 75000);
      spawnKelenvolare("♀", true, 1320, 1480, 0);

      for (let i = 0; i < 3; i++) {
        spawnKelenvolare("♀", false, null, null, 50000 + Math.random() * 50000);
        spawnKelenvolare("♂", false, null, null, 50000 + Math.random() * 50000);
        spawnKelenvolare(Math.random() < 0.5 ? "♀" : "♂", true, null, null, 0);
      }

      spawnSpecificPredator("크리욜로포사우르스", 1780, 1450);
      spawnSpecificPredator("하체고프테릭스", 1120, 1820);

      for (let i = 0; i < 30; i++) spawnEntity(true);

      if (spawnIntervalId) clearInterval(spawnIntervalId);
      spawnIntervalId = setInterval(() => {
        if (isGameRunning && entities.length < 55) spawnEntity(false);
        // 켈렌불라레가 수명으로 모두 사라져 멸종하지 않도록 최소 개체수 유지
        const kelCount = entities.filter(e => e.species === "켈렌불라레").length;
        if (isGameRunning && kelCount < 4) {
          spawnKelenvolare(Math.random() < 0.5 ? "♀" : "♂", false, null, null, 46000);
        }
      }, 1200);
    }

    function spawnSpecificPredator(type, px, py) {
      const entityW = type === "하체고프테릭스" ? 280 : 240;
      const entityH = type === "하체고프테릭스" ? 270 : 70;
      entities.push({
        x: px, y: py,
        baseSpeed: 2.3, speed: 2.3,
        width: entityW, height: entityH,
        type: type, species: type, isTarget: false, angle: Math.random() * Math.PI * 2,
        chaseState: "IDLE", chaseTimer: 0, isResting: false, hp: 90, maxHp: 90
      });
    }

    function spawnHaastEagleFemale() {
      entities.push({
        x: player.x - 110 * x, y: player.y,
        baseSpeed: 6.5, speed: 6.5,
        width: 85, height: 70, type: "하스트수리(♀)",
        species: "하스트수리", gender: "♀", isBaby: false, isTarget: false,
        angle: 0, orbitAngle: 0, radiusMultiplier: 110, orbitSpeed: 0.03,
        hp: 9999, maxHp: 9999
      });
    }

    function spawnHaastEagleBaby(startOrbit = Math.PI) {
      entities.push({
        x: player.x + Math.cos(startOrbit) * 75,
        y: player.y + Math.sin(startOrbit) * 75,
        baseSpeed: 6.5, speed: 6.5,
        width: 52, height: 42, type: "하스트수리(새끼)",
        species: "하스트수리", gender: "👶", isBaby: true, isTarget: false,
        angle: 0, orbitAngle: startOrbit, radiusMultiplier: 75, orbitSpeed: 0.04,
        hp: 9999, maxHp: 9999
      });
    }

    function getLandSpawnX(entityWidth) {
      if (Math.random() < 0.65) {
        return Math.random() * (RIVER_START - entityWidth - 200) + 100;
      } else {
        return Math.random() * (OCEAN_START - RIVER_END - entityWidth - 150) + RIVER_END + 70;
      }
    }

    function spawnKelenvolare(gender, isBaby = false, customX = null, customY = null, initialAgeMs = 0) {
      const kelCount = entities.filter(e => e.species === "켈렌불라레").length;
      if (kelCount >= 26) return;

      const w = isBaby ? 64 : 120;
      const h = isBaby ? 48 : 85;

      let spawnX = customX !== null ? customX + (Math.random() * 60 - 30) : getLandSpawnX(w);
      let spawnY = customY !== null ? customY + (Math.random() * 60 - 30) : Math.random() * (MAP_HEIGHT - 400) + 200;

      if (isWaterArea(spawnX, spawnY, w)) {
        spawnX = customX !== null ? customX : getLandSpawnX(w);
      }

      entities.push({
        x: Math.max(50, Math.min(MAP_WIDTH - w - 50, spawnX)),
        y: Math.max(50, Math.min(MAP_HEIGHT - h - 50, spawnY)),
        baseSpeed: isBaby ? 2.1 : 2.9,
        speed: isBaby ? 2.1 : 2.9,
        width: w,
        height: h,
        type: `켈렌불라레(${gender})${isBaby ? ' 새끼' : ''}`,
        species: "켈렌불라레",
        gender: gender,
        isBaby: isBaby,
        isOld: false,
        birthTime: Date.now() - initialAgeMs, // 태어난 시각 (3분 후 자연사)
        lastBreedTime: 0,
        isTarget: true,
        angle: Math.random() * Math.PI * 2,
        chaseState: "IDLE", chaseTimer: 0, isResting: false,
        hp: isBaby ? 30 : 75, maxHp: isBaby ? 30 : 75,
        clackTimer: 0
      });
    }

    function spawnEntity(inMap = false) {
      if (!isGameRunning) return;
      const rand = Math.random() * 100;
      let type = "로드리게스솔리테어";
      let isTarget = true;

      if (rand < 10) { type = "크리욜로포사우르스"; isTarget = false; }
      else if (rand < 18) { type = "하체고프테릭스"; isTarget = false; }
      else if (rand < 44) { type = "히네리아"; isTarget = true; }
      else if (rand < 72) { type = "이크티오스테가"; isTarget = true; }

      const entityW = type === "하체고프테릭스" ? 280 : (type === "크리욜로포사우르스" ? 240 : (type === "히네리아" ? 120 : (type === "이크티오스테가" ? 130 : 65)));
      const entityH = type === "하체고프테릭스" ? 270 : (type === "크리욜로포사우르스" ? 70 : (type === "히네리아" ? 50 : (type === "이크티오스테가" ? 48 : 45)));

      let spawnX = 1000;
      let spawnY = Math.random() * (MAP_HEIGHT - 400) + 200;

      if (type === "히네리아") {
        if (Math.random() < 0.4) {
          spawnX = Math.random() * (RIVER_END - RIVER_START - entityW - 40) + RIVER_START + 20;
        } else {
          spawnX = Math.random() * (MAP_WIDTH - OCEAN_START - entityW - 100) + OCEAN_START + 50;
        }
      } else if (type === "이크티오스테가") {
        spawnX = Math.random() * (MAP_WIDTH - 400) + 200;
      } else {
        spawnX = getLandSpawnX(entityW);
      }

      const baseSpeed = isTarget ? (1.8 + Math.random() * 1.6) : (2.2 + Math.random() * 1.0);

      entities.push({
        x: spawnX, y: spawnY,
        baseSpeed: baseSpeed, speed: baseSpeed,
        width: entityW, height: entityH,
        type: type, species: type, isTarget: isTarget, angle: Math.random() * Math.PI * 2,
        chaseState: "IDLE", chaseTimer: 0, isResting: false,
        hp: isTarget ? 45 : 90, maxHp: isTarget ? 45 : 90
      });
    }

    function updatePlayer() {
      let dx = 0, dy = 0;

      if (keys["KeyW"] || keys["ArrowUp"]) dy -= 1;
      if (keys["KeyS"] || keys["ArrowDown"]) dy += 1;
      if (keys["KeyA"] || keys["ArrowLeft"]) dx -= 1;
      if (keys["KeyD"] || keys["ArrowRight"]) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        dx /= len;
        dy /= len;
        player.angle = Math.atan2(dy, dx);
      }

      const currentSpeed = player.clawTimer > 0 ? player.speed * 1.9 : player.speed;
      if (player.clawTimer > 0) {
        player.x += Math.cos(player.angle) * currentSpeed;
        player.y += Math.sin(player.angle) * currentSpeed;
      } else {
        player.x += dx * currentSpeed;
        player.y += dy * currentSpeed;
      }

      player.x = Math.max(0, Math.min(MAP_WIDTH - player.width, player.x));
      player.y = Math.max(0, Math.min(MAP_HEIGHT - player.height, player.y));

      if (player.hitCooldown > 0) player.hitCooldown--;
      if (player.clawTimer > 0) player.clawTimer--;
      if (player.clawCooldown > 0) player.clawCooldown--;

      camera.x = Math.max(0, Math.min(MAP_WIDTH - camera.width, player.x + player.width / 2 - camera.width / 2));
      camera.y = Math.max(0, Math.min(MAP_HEIGHT - camera.height, player.y + player.height / 2 - camera.height / 2));
    }

    function checkCollision(r1, r2) {
      return (
        r1.x < r2.x + r2.width &&
        r1.x + r1.width > r2.x &&
        r1.y < r2.y + r2.height &&
        r1.y + r1.height > r2.y
      );
    }

    function updateStatusBars() {
      playerHpBar.style.width = `${(playerHp / MAX_HP) * 100}%`;
      playerOxygenBar.style.width = `${(playerOxygen / MAX_OXYGEN) * 100}%`;
      hpNumText.innerText = Math.ceil(playerHp);
      oxyNumText.innerText = Math.ceil(playerOxygen);
    }

    function update() {
      if (!isGameRunning) return;

      const now = Date.now();

      const elapsedSec = Math.floor((now - gameStartTime) / 1000);
      const isNight = (elapsedSec % 120) >= 60;
      timeStateText.innerText = isNight ? "🌙 밤" : "☀️ 낮";

      updatePlayer();

      if (!hasBabySpawned) {
        nests.forEach((nest) => {
          if (checkCollision(player, nest)) {
            hasBabySpawned = true;
            spawnHaastEagleBaby(Math.PI / 2);
            score += 10;
            scoreText.innerText = score;
            playerHp = Math.min(MAX_HP, playerHp + 30);
            playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 30);
          }
        });
      }

      const playerCenterX = player.x + player.width / 2;
      const playerCenterY = player.y + player.height / 2;
      const playerInWater = isWaterArea(playerCenterX, playerCenterY, 0);

      if (playerInWater) {
        terrainText.innerText = isOceanArea(playerCenterX, playerCenterY) ? "🌊 바다" : "🏞️ 강";
        playerOxygen = Math.max(0, playerOxygen - 0.14);
        if (playerOxygen <= 0) {
          playerHp = Math.max(0, playerHp - 0.35);
        }
      } else {
        terrainText.innerText = "🌲 숲";
        playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 0.3);
      }

      if (playerHp <= 0) {
        isGameRunning = false;
        isPausedForHelp = false;
        overlayTitle.innerText = `게임 오버 · ${score}점`;
        startBtn.innerText = "다시 시작";
        startOverlay.style.display = "flex";
      }

      updateStatusBars();

      for (let cIdx = clawEffects.length - 1; cIdx >= 0; cIdx--) {
        clawEffects[cIdx].life--;
        if (clawEffects[cIdx].life <= 0) clawEffects.splice(cIdx, 1);
      }

      for (let i = entities.length - 1; i >= 0; i--) {
        const e = entities[i];

        // 🦕 켈렌불라레 3분(180초) 수명 주기 처리
        if (e.species === "켈렌불라레") {
          const age = now - e.birthTime;

          // 180초(3분) 도달 시 수명 다해 자연사
          if (age >= KELENVOLARE_LIFESPAN) {
            entities.splice(i, 1);
            continue;
          }

          // 45초 경과 시 새끼에서 성체로 성장
          if (e.isBaby && age >= 45000) {
            e.isBaby = false;
            e.width = 120;
            e.height = 85;
            e.speed = 2.9;
            e.hp = 75;
            e.maxHp = 75;
            e.type = `켈렌불라레(${e.gender})`;
          }

          // 160초 경과 시 노년기 진입 (속도 약간 감소 및 노화 표시)
          if (!e.isBaby && !e.isOld && age >= 160000) {
            e.isOld = true;
            e.speed = 2.1;
            e.type = `켈렌불라레(${e.gender}) 노화`;
          }
        }

        const eCenterX = e.x + e.width / 2;
        const eCenterY = e.y + e.height / 2;

        const dx = playerCenterX - eCenterX;
        const dy = playerCenterY - eCenterY;
        const distance = Math.hypot(dx, dy);

        // 아군 하스트수리(암컷 및 새끼들)
        if (e.species === "하스트수리" && e !== player) {
          e.orbitAngle = (e.orbitAngle || 0) + (e.orbitSpeed || 0.03);

          const currentRadius = e.radiusMultiplier * x;
          const targetX = playerCenterX + Math.cos(e.orbitAngle) * currentRadius - e.width / 2;
          const targetY = playerCenterY + Math.sin(e.orbitAngle) * currentRadius - e.height / 2;

          e.angle = e.orbitAngle + Math.PI / 2;

          e.x += (targetX - e.x) * 0.15;
          e.y += (targetY - e.y) * 0.15;

          if (e.gender === "♀") {
            for (let j = entities.length - 1; j >= 0; j--) {
              const other = entities[j];
              if (other !== e && other.species !== "하스트수리" && other.species !== "켈렌불라레" && other.isTarget === false) {
                if (checkCollision(e, other)) {
                  other.hp -= 1.2;
                  if (other.hp <= 0) {
                    score += 5;
                    scoreText.innerText = score;
                    entities.splice(j, 1);
                    if (j < i) i--;
                  }
                }
              }
            }
          }
          continue;
        }

        // 켈렌불라레 번식
        let isCourting = false;
        if (e.species === "켈렌불라레" && !e.isBaby) {
          for (let j = 0; j < entities.length; j++) {
            const partner = entities[j];
            if (partner.species === "켈렌불라레" && partner.gender !== e.gender && !partner.isBaby) {
              const kDist = Math.hypot(partner.x - e.x, partner.y - e.y);
              if (kDist < 220 && (now - (e.lastBreedTime || 0) > 10000)) {
                isCourting = true;
                e.angle = Math.atan2(partner.y - e.y, partner.x - e.x);
                e.clackTimer = (e.clackTimer || 0) + 1;
                if (e.clackTimer > 90) {
                  e.clackTimer = 0;
                  e.lastBreedTime = now;
                  partner.lastBreedTime = now;
                  if (e.gender === "♀") {
                    const babyGender = Math.random() < 0.5 ? "♀" : "♂";
                    spawnKelenvolare(babyGender, true, e.x, e.y, 0);
                  }
                }
                break;
              }
            }
          }
        }

        const prevX = e.x;
        const prevY = e.y;

        // 포식자 근접 추격 AI
        if (!e.isTarget && e.species !== "하스트수리") {
          if (distance < 420) {
            if (e.chaseState === "IDLE") {
              e.chaseState = "CHASING";
              e.chaseTimer = now;
              e.isResting = false;
            }
          } else if (distance > 580) {
            e.chaseState = "IDLE";
            e.isResting = false;
          }

          if (e.chaseState === "CHASING") {
            if (!e.isResting) {
              const targetAngle = Math.atan2(dy, dx);
              e.angle = targetAngle;
              e.x += Math.cos(targetAngle) * (e.speed + 1.3);
              e.y += Math.sin(targetAngle) * (e.speed + 1.3);

              if (now - e.chaseTimer > 6000) {
                e.isResting = true;
                e.chaseTimer = now;
              }
            } else {
              if (now - e.chaseTimer > 1200) {
                e.isResting = false;
                e.chaseTimer = now;
              }
            }
          } else {
            e.angle += (Math.random() - 0.5) * (Math.PI / 45);
            e.x += Math.cos(e.angle) * e.speed;
            e.y += Math.sin(e.angle) * e.speed;
          }
        } else if (e.isTarget) {
          if (distance < 160) {
            e.chaseState = "FLEEING";
            e.angle = Math.atan2(-dy, -dx);
          } else {
            e.chaseState = "IDLE";
          }

          const currentSpeed = e.chaseState === "FLEEING" ? e.speed * 1.35 : (isCourting ? e.speed * 0.5 : e.speed);
          if (e.chaseState === "IDLE" && !isCourting) e.angle += (Math.random() - 0.5) * (Math.PI / 45);

          e.x += Math.cos(e.angle) * currentSpeed;
          e.y += Math.sin(e.angle) * currentSpeed;
        }

        if (e.x <= 0) { e.x = 0; e.angle = Math.PI - e.angle; }
        else if (e.x + e.width >= MAP_WIDTH) { e.x = MAP_WIDTH - e.width; e.angle = Math.PI - e.angle; }
        if (e.y <= 0) { e.y = 0; e.angle = -e.angle; }
        else if (e.y + e.height >= MAP_HEIGHT) { e.y = MAP_HEIGHT - e.height; e.angle = -e.angle; }

        const inWater = isWaterArea(e.x, e.y, e.width);

        if (e.type === "히네리아") {
          if (!inWater) {
            e.x = prevX;
            e.y = prevY;
            e.angle = Math.PI - e.angle + (Math.random() - 0.5) * 0.4;
          }
        } else if (e.species !== "이크티오스테가" && e.type !== "하체고프테릭스") {
          if (inWater) {
            e.x = prevX;
            e.y = prevY;
            e.angle = Math.PI - e.angle + (Math.random() - 0.5) * 0.4;
          }
        }

        if (checkCollision(player, e)) {
          if (e.isTarget) {
            if (e.species === "켈렌불라레") {
              score += e.isBaby ? 2 : 4;
              playerHp = Math.min(MAX_HP, playerHp + (e.isBaby ? 20 : 35));
              playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 30);
            } else {
              score += 1;
              playerHp = Math.min(MAX_HP, playerHp + 15);
              playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 25);
            }
            scoreText.innerText = score;
            entities.splice(i, 1);
          } else if (e.species !== "하스트수리") {
            if (player.hitCooldown <= 0 && player.clawTimer <= 0) {
              playerHp = Math.max(0, playerHp - 15);
              player.hitCooldown = 30;
              const knockAngle = Math.atan2(playerCenterY - eCenterY, playerCenterX - eCenterX);
              player.x = Math.max(0, Math.min(MAP_WIDTH - player.width, player.x + Math.cos(knockAngle) * 55));
              player.y = Math.max(0, Math.min(MAP_HEIGHT - player.height, player.y + Math.sin(knockAngle) * 55));
            }
          }
        }
      }
    }

    function drawMapBackground() {
      const oceanGrad = ctx.createLinearGradient(OCEAN_START - camera.x, 0, MAP_WIDTH - camera.x, 0);
      oceanGrad.addColorStop(0, "#1e5f74");
      oceanGrad.addColorStop(1, "#0b3c4d");
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(OCEAN_START - camera.x, 0 - camera.y, MAP_WIDTH - OCEAN_START, MAP_HEIGHT);

      const forestGrad = ctx.createLinearGradient(0 - camera.x, 0, OCEAN_START - camera.x, 0);
      forestGrad.addColorStop(0, "#2d4d2d");
      forestGrad.addColorStop(1, "#385e38");
      ctx.fillStyle = forestGrad;
      ctx.fillRect(0 - camera.x, 0 - camera.y, OCEAN_START, MAP_HEIGHT);

      ctx.fillStyle = "rgba(15, 35, 15, 0.4)";
      for (let i = 100; i < MAP_HEIGHT; i += 300) {
        ctx.beginPath();
        ctx.arc(400 - camera.x, i - camera.y, 140, 0, Math.PI * 2);
        ctx.arc(1400 - camera.x, i + 100 - camera.y, 160, 0, Math.PI * 2);
        ctx.arc(2900 - camera.x, i + 50 - camera.y, 150, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#e6c280";
      ctx.fillRect(RIVER_START - 45 - camera.x, 0 - camera.y, (RIVER_END - RIVER_START) + 90, MAP_HEIGHT);

      const riverGrad = ctx.createLinearGradient(RIVER_START - camera.x, 0, RIVER_END - camera.x, 0);
      riverGrad.addColorStop(0, "#2471a3");
      riverGrad.addColorStop(0.5, "#2980b9");
      riverGrad.addColorStop(1, "#2471a3");
      ctx.fillStyle = riverGrad;
      ctx.fillRect(RIVER_START - camera.x, 0 - camera.y, RIVER_END - RIVER_START, MAP_HEIGHT);

      ctx.fillStyle = "#e6c280";
      ctx.fillRect(OCEAN_START - 45 - camera.x, 0 - camera.y, 45, MAP_HEIGHT);
    }

    function drawNests() {
      nests.forEach((nest) => {
        const nx = nest.x - camera.x;
        const ny = nest.y - camera.y;
        ctx.fillStyle = "#8d6e63";
        ctx.beginPath();
        ctx.ellipse(nx, ny, 35, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        if (nest.hasEgg) {
          ctx.fillStyle = nest.eggState === "FERTILIZED" ? "#2ecc71" : "#fff8e1";
          ctx.beginPath();
          ctx.ellipse(nx - 6, ny - 2, 8, 11, 0, 0, Math.PI * 2);
          ctx.ellipse(nx + 6, ny - 2, 8, 11, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function drawHaastEagle(w, h, isBaby = false) {
      if (isBaby) {
        ctx.fillStyle = "#dfe6e9";
        ctx.beginPath();
        ctx.ellipse(-w * 0.05, -h * 0.34, w * 0.24, h * 0.16, -0.25, 0, Math.PI * 2);
        ctx.ellipse(-w * 0.05, h * 0.34, w * 0.24, h * 0.16, 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#b2bec3";
        ctx.beginPath();
        ctx.arc(-w * 0.32, 0, h * 0.14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(-w * 0.02, 0, h * 0.34, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f5f6fa";
        ctx.beginPath();
        ctx.arc(w * 0.24, 0, h * 0.26, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#1e272e";
        ctx.beginPath();
        ctx.arc(w * 0.30, -h * 0.11, 2.8, 0, Math.PI * 2);
        ctx.arc(w * 0.30, h * 0.11, 2.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffeaa7";
        ctx.beginPath();
        ctx.moveTo(w * 0.42, -h * 0.09);
        ctx.lineTo(w * 0.56, 0);
        ctx.lineTo(w * 0.42, h * 0.09);
        ctx.closePath();
        ctx.fill();
        return;
      }

      ctx.fillStyle = "#3e2723";
      ctx.beginPath();
      ctx.moveTo(w * 0.05, -h * 0.1);
      ctx.quadraticCurveTo(-w * 0.1, -h * 0.55, -w * 0.38, -h * 0.45);
      ctx.quadraticCurveTo(-w * 0.15, -h * 0.25, w * 0.15, -h * 0.1);
      ctx.closePath(); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(w * 0.05, h * 0.1);
      ctx.quadraticCurveTo(-w * 0.1, h * 0.55, -w * 0.38, h * 0.45);
      ctx.quadraticCurveTo(-w * 0.15, h * 0.25, w * 0.15, h * 0.1);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#2d1b18";
      ctx.beginPath();
      ctx.moveTo(-w * 0.25, -h * 0.1); ctx.lineTo(-w * 0.45, 0); ctx.lineTo(-w * 0.25, h * 0.1);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#4e342e";
      ctx.beginPath(); ctx.ellipse(-w * 0.05, 0, w * 0.35, h * 0.24, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#795548";
      ctx.beginPath(); ctx.arc(w * 0.22, 0, h * 0.2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#f39c12";
      ctx.beginPath();
      ctx.moveTo(w * 0.32, -h * 0.1); ctx.lineTo(w * 0.55, 0); ctx.lineTo(w * 0.32, h * 0.1);
      ctx.closePath(); ctx.fill();
    }

    function drawHatzegopteryx(w, h, state) {
      const bodyColor = state === "CHASING" ? "#616a6b" : "#7f8c8d";
      const neckColor = state === "CHASING" ? "#707b7c" : "#95a5a6";
      const membraneColor = state === "CHASING" ? "#566573" : "#6c7a89";

      ctx.fillStyle = membraneColor;
      ctx.beginPath();
      ctx.moveTo(-w * 0.05, -h * 0.04);
      ctx.lineTo(-w * 0.14, -h * 0.50);
      ctx.quadraticCurveTo(-w * 0.18, -h * 0.22, -w * 0.32, -h * 0.04);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-w * 0.05, h * 0.04);
      ctx.lineTo(-w * 0.14, h * 0.50);
      ctx.quadraticCurveTo(-w * 0.18, h * 0.22, -w * 0.32, h * 0.04);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#bdc3c7";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-w * 0.05, -h * 0.04);
      ctx.lineTo(-w * 0.14, -h * 0.50);
      ctx.moveTo(-w * 0.05, h * 0.04);
      ctx.lineTo(-w * 0.14, h * 0.50);
      ctx.stroke();

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.ellipse(-w * 0.16, 0, w * 0.14, h * 0.06, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = neckColor;
      ctx.beginPath();
      ctx.moveTo(-w * 0.06, -h * 0.035);
      ctx.lineTo(w * 0.10, -h * 0.03);
      ctx.lineTo(w * 0.10, h * 0.03);
      ctx.lineTo(-w * 0.06, h * 0.035);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.ellipse(w * 0.10, 0, w * 0.045, h * 0.038, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#d4ac0d";
      ctx.beginPath();
      ctx.moveTo(w * 0.11, -h * 0.032);
      ctx.lineTo(w * 0.65, 0);
      ctx.lineTo(w * 0.11, h * 0.032);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = state === "CHASING" ? "#e74c3c" : "#1b2631";
      ctx.beginPath();
      ctx.arc(w * 0.12, -h * 0.022, 2.5, 0, Math.PI * 2);
      ctx.arc(w * 0.12, h * 0.022, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCryolophosaurus(w, h, state) {
      const bodyColor = state === "CHASING" ? "#b88a58" : "#9c7e5c";
      const stripeColor = state === "CHASING" ? "#4a2c11" : "#3d2b1f";

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.moveTo(-w * 0.05, -h * 0.15);
      ctx.quadraticCurveTo(-w * 0.35, -h * 0.09, -w * 0.65, 0);
      ctx.quadraticCurveTo(-w * 0.35, h * 0.09, -w * 0.05, h * 0.15);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(-w * 0.08, -h * 0.18, w * 0.09, h * 0.16, -0.2, 0, Math.PI * 2);
      ctx.ellipse(-w * 0.08, h * 0.18, w * 0.09, h * 0.16, 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.18, h * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(w * 0.12, -h * 0.13);
      ctx.lineTo(w * 0.26, -h * 0.11);
      ctx.lineTo(w * 0.26, h * 0.11);
      ctx.lineTo(w * 0.12, h * 0.13);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = stripeColor;
      const stripePositions = [-0.52, -0.42, -0.32, -0.22, -0.12, -0.02, 0.08, 0.18];
      stripePositions.forEach((pos, idx) => {
        const sw = w * 0.022;
        const sh = idx < 4 ? h * (0.07 + idx * 0.02) : h * 0.28;
        ctx.beginPath();
        ctx.ellipse(w * pos, 0, sw, sh, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.moveTo(w * 0.24, -h * 0.15);
      ctx.quadraticCurveTo(w * 0.42, -h * 0.14, w * 0.44, 0);
      ctx.quadraticCurveTo(w * 0.42, h * 0.14, w * 0.24, h * 0.15);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#5d7687";
      ctx.beginPath();
      ctx.arc(w * 0.29, -h * 0.11, h * 0.055, 0, Math.PI * 2);
      ctx.arc(w * 0.29, h * 0.11, h * 0.055, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#8e352e";
      ctx.beginPath();
      ctx.ellipse(w * 0.26, -h * 0.12, w * 0.012, h * 0.05, 0, 0, Math.PI * 2);
      ctx.ellipse(w * 0.26, h * 0.12, w * 0.012, h * 0.05, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#8a5a36";
      ctx.strokeStyle = "#3d2b1f";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(w * 0.28, 0, w * 0.032, h * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    function drawKelenvolare(w, h, clackTimer = 0, isBaby = false, isOld = false) {
      if (isBaby) {
        ctx.fillStyle = "#d2b48c";
        ctx.beginPath();
        ctx.arc(-w * 0.34, 0, h * 0.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f5deb3";
        ctx.beginPath();
        ctx.ellipse(-w * 0.04, 0, w * 0.32, h * 0.32, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#deb887";
        ctx.beginPath();
        ctx.ellipse(-w * 0.08, 0, w * 0.16, h * 0.14, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#faebd7";
        ctx.beginPath();
        ctx.arc(w * 0.22, 0, h * 0.24, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#2c221e";
        ctx.beginPath();
        ctx.arc(w * 0.27, -h * 0.11, 2.5, 0, Math.PI * 2);
        ctx.arc(w * 0.27, h * 0.11, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f39c12";
        ctx.beginPath();
        ctx.moveTo(w * 0.38, -h * 0.09);
        ctx.lineTo(w * 0.54, 0);
        ctx.lineTo(w * 0.38, h * 0.09);
        ctx.closePath();
        ctx.fill();
        return;
      }

      // 노년기일 경우 전체적으로 깃털과 뿔 색이 바랜 느낌으로 표현
      ctx.fillStyle = isOld ? "#59504c" : "#2c221e";
      ctx.beginPath();
      ctx.moveTo(-w * 0.25, -h * 0.12); ctx.lineTo(-w * 0.48, 0); ctx.lineTo(-w * 0.25, h * 0.12);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = isOld ? "#7c7068" : "#4a3b32";
      ctx.beginPath(); ctx.ellipse(-w * 0.05, 0, w * 0.32, h * 0.25, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = isOld ? "#a68a73" : "#8b4513";
      ctx.strokeStyle = isOld ? "#574a42" : "#2b1810";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-w * 0.08, -h * 0.1);
      ctx.quadraticCurveTo(-w * 0.48, -h * 0.9, w * 0.15, -h * 0.7);
      ctx.quadraticCurveTo(-w * 0.05, -h * 0.35, -w * 0.08, -h * 0.1);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-w * 0.08, h * 0.1);
      ctx.quadraticCurveTo(-w * 0.48, h * 0.9, w * 0.15, h * 0.7);
      ctx.quadraticCurveTo(-w * 0.05, h * 0.35, -w * 0.08, h * 0.1);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.fillStyle = isOld ? "#6b5f58" : "#362a24";
      ctx.beginPath(); ctx.ellipse(w * 0.18, 0, w * 0.15, h * 0.14, 0, 0, Math.PI * 2); ctx.fill();

      const offset = (clackTimer % 4 > 2) ? 4 : 0;
      ctx.fillStyle = isOld ? "#e0d8b8" : "#d4c585";
      ctx.beginPath();
      ctx.moveTo(w * 0.26, -h * 0.1 - offset); ctx.lineTo(w * 0.55, 0); ctx.lineTo(w * 0.26, h * 0.1 + offset);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#2c2a29";
      ctx.beginPath();
      ctx.moveTo(w * 0.45, -h * 0.05); ctx.lineTo(w * 0.55, 0); ctx.lineTo(w * 0.45, h * 0.05);
      ctx.closePath(); ctx.fill();
    }

    function drawSolitaire(w, h) {
      ctx.fillStyle = "#d4ac0d";
      ctx.beginPath(); ctx.ellipse(0, 0, w * 0.35, h * 0.3, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.ellipse(w * 0.02, 0, w * 0.2, h * 0.18, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#d4ac0d";
      ctx.beginPath(); ctx.arc(w * 0.24, 0, h * 0.18, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#17202a";
      ctx.beginPath();
      ctx.moveTo(w * 0.32, -h * 0.08); ctx.lineTo(w * 0.52, 0); ctx.lineTo(w * 0.32, h * 0.08);
      ctx.closePath(); ctx.fill();
    }

    function drawHyneria(w, h) {
      ctx.fillStyle = "#85929e";
      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.42, h * 0.23, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#2c3e50";
      ctx.beginPath();
      ctx.ellipse(-w * 0.02, -h * 0.15, w * 0.28, h * 0.032, 0, 0, Math.PI * 2);
      ctx.ellipse(-w * 0.02, h * 0.15, w * 0.28, h * 0.032, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#5d6d7e";
      ctx.beginPath();
      ctx.ellipse(w * 0.06, -h * 0.28, w * 0.11, h * 0.13, -0.35, 0, Math.PI * 2);
      ctx.ellipse(w * 0.06, h * 0.28, w * 0.11, h * 0.13, 0.35, 0, Math.PI * 2);
      ctx.ellipse(-w * 0.18, -h * 0.23, w * 0.08, h * 0.09, -0.3, 0, Math.PI * 2);
      ctx.ellipse(-w * 0.18, h * 0.23, w * 0.08, h * 0.09, 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#566573";
      ctx.beginPath();
      ctx.ellipse(-w * 0.42, 0, w * 0.12, h * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#1b2631";
      ctx.beginPath();
      ctx.arc(w * 0.3, -h * 0.08, 2.5, 0, Math.PI * 2);
      ctx.arc(w * 0.3, h * 0.08, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawIchthyostega(w, h) {
      ctx.fillStyle = "#5d4037";
      ctx.beginPath();
      ctx.moveTo(-w * 0.02, -h * 0.14);
      ctx.quadraticCurveTo(-w * 0.35, -h * 0.09, -w * 0.65, 0);
      ctx.quadraticCurveTo(-w * 0.35, h * 0.09, -w * 0.02, h * 0.14);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#6e2c00";
      ctx.beginPath();
      ctx.ellipse(w * 0.05, 0, w * 0.22, h * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#421b00";
      ctx.beginPath();
      ctx.rect(-w * 0.08, -h * 0.4, w * 0.07, h * 0.2);
      ctx.rect(w * 0.12, -h * 0.4, w * 0.07, h * 0.2);
      ctx.rect(-w * 0.08, h * 0.2, w * 0.07, h * 0.2);
      ctx.rect(w * 0.12, h * 0.2, w * 0.07, h * 0.2);
      ctx.fill();

      ctx.fillStyle = "#795548";
      ctx.beginPath();
      ctx.ellipse(w * 0.28, 0, w * 0.15, h * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(w * 0.31, -h * 0.08, 3.2, 0, Math.PI * 2);
      ctx.arc(w * 0.31, h * 0.08, 3.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(w * 0.32, -h * 0.08, 1.8, 0, Math.PI * 2);
      ctx.arc(w * 0.32, h * 0.08, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMapBackground();
      drawNests();

      clawEffects.forEach((c) => {
        const alpha = c.life / c.maxLife;
        ctx.save();
        ctx.translate(c.x - camera.x, c.y - camera.y);
        ctx.rotate(c.angle);
        ctx.strokeStyle = `rgba(255, 220, 100, ${alpha})`;
        ctx.lineWidth = 4;
        for (let line = -1; line <= 1; line++) {
          ctx.beginPath();
          ctx.arc(0, line * 14, 32, -0.7, 0.7);
          ctx.stroke();
        }
        ctx.restore();
      });

      if (player.hitCooldown % 4 < 2) {
        ctx.save();
        ctx.translate(player.x + player.width / 2 - camera.x, player.y + player.height / 2 - camera.y);
        ctx.rotate(player.angle);
        drawHaastEagle(player.width, player.height, false);
        ctx.restore();
      }

      entities.forEach((e) => {
        if (
          e.x + e.width > camera.x && e.x < camera.x + camera.width &&
          e.y + e.height > camera.y && e.y < camera.y + camera.height
        ) {
          const screenX = e.x + e.width / 2 - camera.x;
          const screenY = e.y + e.height / 2 - camera.y;

          ctx.save();
          ctx.translate(screenX, screenY);
          ctx.rotate(e.angle);

          if (e.species === "하스트수리") drawHaastEagle(e.width, e.height, e.isBaby);
          else if (e.species === "켈렌불라레") drawKelenvolare(e.width, e.height, e.clackTimer, e.isBaby, e.isOld);
          else if (e.type === "크리욜로포사우르스") drawCryolophosaurus(e.width, e.height, e.chaseState);
          else if (e.type === "하체고프테릭스") drawHatzegopteryx(e.width, e.height, e.chaseState);
          else if (e.type === "로드리게스솔리테어") drawSolitaire(e.width, e.height);
          else if (e.type === "히네리아") drawHyneria(e.width, e.height);
          else if (e.type === "이크티오스테가") drawIchthyostega(e.width, e.height);

          ctx.restore();

          if (e.species !== "하스트수리") {
            ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
            ctx.fillRect(screenX - 24, screenY - e.height / 2 - 14, 48, 4);
            ctx.fillStyle = e.isTarget ? "#2ecc71" : "#ff4757";
            ctx.fillRect(screenX - 24, screenY - e.height / 2 - 14, (e.hp / e.maxHp) * 48, 4);
          }

          ctx.font = "600 12px sans-serif";
          if (e.species === "하스트수리") {
            ctx.fillStyle = e.isBaby ? "#ffeaa7" : "#ff79c6";
          } else if (e.species === "켈렌불라레") {
            ctx.fillStyle = e.isBaby ? "#7bed9f" : (e.isOld ? "#ced6e0" : "#2ecc71");
          } else if (!e.isTarget) {
            ctx.fillStyle = e.chaseState === "CHASING" ? "#ff6b6b" : "#ffa502";
          } else {
            ctx.fillStyle = "#f1f2f6";
          }
          ctx.fillText(`${e.type}`, screenX - 30, screenY - e.height / 2 - 18);
        }
      });

      const elapsedSec = Math.floor((Date.now() - gameStartTime) / 1000);
      const isNight = (elapsedSec % 120) >= 60;

      if (isNight) {
        ctx.save();
        ctx.fillStyle = "rgba(10, 15, 35, 0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const pScreenX = player.x + player.width / 2 - camera.x;
        const pScreenY = player.y + player.height / 2 - camera.y;

        const lightGrad = ctx.createRadialGradient(pScreenX, pScreenY, 30, pScreenX, pScreenY, 240);
        lightGrad.addColorStop(0, "rgba(255, 240, 200, 0.25)");
        lightGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = lightGrad;
        ctx.beginPath();
        ctx.arc(pScreenX, pScreenY, 240, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
