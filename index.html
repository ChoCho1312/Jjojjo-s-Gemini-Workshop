<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>하스트수리의 삶 - 비율 교정 패치</title>
  <style>
    body {
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    h1 { margin-bottom: 5px; color: #f39c12; font-size: 1.5rem; }

    #game-container {
      position: relative;
      display: inline-block;
      margin-top: 5px;
    }

    #gameCanvas {
      background-color: #222831;
      border: 4px solid #f39c12;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
      max-width: 100%;
      height: auto;
    }

    #start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      border-radius: 8px; z-index: 10;
    }

    #start-btn {
      padding: 12px 30px; font-size: 1.5rem; font-weight: bold;
      color: #ffffff; background-color: #e67e22; border: none;
      border-radius: 30px; cursor: pointer;
      box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
    }

    #status {
      margin-top: 10px; font-size: 1rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 15px; border-radius: 20px;
      display: inline-flex; gap: 15px; align-items: center;
      flex-wrap: wrap; justify-content: center;
    }

    .bar-container { display: flex; align-items: center; gap: 6px; }
    .bar-bg { width: 100px; height: 14px; background-color: #444; border-radius: 8px; overflow: hidden; border: 2px solid #555; }
    #playerHpBar { width: 100%; height: 100%; background: linear-gradient(90deg, #e74c3c, #c0392b); }
    #playerOxygenBar { width: 100%; height: 100%; background: linear-gradient(90deg, #3498db, #2ecc71); }

    #controls-wrapper {
      display: flex; justify-content: center; align-items: center;
      gap: 15px; margin-top: 10px;
    }

    #mobile-controls {
      display: grid; grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(2, 55px); gap: 6px;
    }

    .btn-pad {
      width: 55px; height: 55px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(243, 156, 18, 0.6);
      border-radius: 12px; color: #f39c12;
      font-size: 1.5rem; font-weight: bold;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; touch-action: manipulation;
    }

    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    .action-btn {
      width: 75px; height: 75px; border-radius: 50%;
      font-size: 0.95rem; font-weight: bold;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      cursor: pointer; touch-action: manipulation;
    }

    #btn-shoot { background: rgba(46, 204, 113, 0.3); border: 3px solid #2ecc71; color: #2ecc71; }

    .guide { color: #cccccc; font-size: 0.85rem; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>🦅 하스트수리의 삶</h1>
  <p class="guide">🦖 크리올로포(몸체·꼬리 2배 연장) | 🦇 하체고프(몸집 유지, 날개 길게 연장)</p>

  <div id="game-container">
    <canvas id="gameCanvas" width="1250" height="800"></canvas>
    
    <div id="start-overlay">
      <h2 id="overlay-title" style="font-size: 2rem; color: #f39c12; margin-bottom: 20px;">🦅 하스트수리의 삶</h2>
      <button id="start-btn" onclick="startGame()">게임 시작</button>
    </div>
  </div>

  <div id="status">
    <span>시간: <strong id="timeStateText" style="color: #f1c40f;">☀️ 낮</strong></span>
    <span>점수: <strong id="scoreText" style="color: #f1c40f;">0</strong></span>
    <div class="bar-container">
      <span>❤️ 체력:</span>
      <div class="bar-bg"><div id="playerHpBar"></div></div>
    </div>
    <div class="bar-container">
      <span>💨 산소:</span>
      <div class="bar-bg"><div id="playerOxygenBar"></div></div>
    </div>
  </div>

  <div id="controls-wrapper">
    <div id="mobile-controls">
      <div class="btn-pad" id="btn-up">▲</div>
      <div class="btn-pad" id="btn-left">◀</div>
      <div class="btn-pad" id="btn-down">▼</div>
      <div class="btn-pad" id="btn-right">►</div>
    </div>
    <div id="btn-shoot" class="action-btn">☠️<br>독 발사</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const timeStateText = document.getElementById("timeStateText");
    const scoreText = document.getElementById("scoreText");
    const playerHpBar = document.getElementById("playerHpBar");
    const playerOxygenBar = document.getElementById("playerOxygenBar");
    const startOverlay = document.getElementById("start-overlay");
    const overlayTitle = document.getElementById("overlay-title");

    const x = 1.0;

    const MAP_WIDTH = 5000;
    const MAP_HEIGHT = 3200;

    const camera = { x: 0, y: 0, width: 1250, height: 800 };

    let score = 0;
    let gameStartTime = 0;
    let isGameRunning = false;
    let spawnIntervalId = null;

    let playerHp = 100;
    const MAX_HP = 100;
    let playerOxygen = 100;
    const MAX_OXYGEN = 100;
    let lastShootTime = 0;

    const player = {
      x: 2500, y: 1600, width: 85, height: 70, speed: 6.5, angle: 0,
      species: "하스트수리", gender: "♂", hitCooldown: 0
    };

    const keys = {};
    let projectiles = []; 
    let entities = [];
    let nests = [];
    let hasBabySpawned = false;

    window.addEventListener("keydown", (e) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
      }
      keys[e.key] = true;

      if (e.key === " " && isGameRunning) {
        shootPoison(player, "PLAYER");
      }
    });
    
    window.addEventListener("keyup", (e) => keys[e.key] = false);

    function setupTouchButton(buttonId, keyName) {
      const btn = document.getElementById(buttonId);
      const press = (e) => { e.preventDefault(); keys[keyName] = true; };
      const release = (e) => { e.preventDefault(); keys[keyName] = false; };
      btn.addEventListener("touchstart", press, { passive: false });
      btn.addEventListener("touchend", release, { passive: false });
      btn.addEventListener("mousedown", press);
      btn.addEventListener("mouseup", release);
      btn.addEventListener("mouseleave", release);
    }

    setupTouchButton("btn-up", "ArrowUp");
    setupTouchButton("btn-down", "ArrowDown");
    setupTouchButton("btn-left", "ArrowLeft");
    setupTouchButton("btn-right", "ArrowRight");

    document.getElementById("btn-shoot").addEventListener("click", () => {
      if (isGameRunning) shootPoison(player, "PLAYER");
    });

    function isWaterArea(px, py, width = 0, height = 0) {
      const rightX = px + width;
      if (rightX >= 3400) return true;
      if (rightX >= 1800 && px <= 2500) return true;
      return false;
    }

    function shootPoison(shooter, shooterType) {
      const now = Date.now();
      if (shooterType === "PLAYER" && now - lastShootTime < 250) return;
      if (shooterType === "PLAYER") lastShootTime = now;

      const pSpeed = 14;
      projectiles.push({
        x: shooter.x + shooter.width / 2,
        y: shooter.y + shooter.height / 2,
        vx: Math.cos(shooter.angle) * pSpeed,
        vy: Math.sin(shooter.angle) * pSpeed,
        radius: shooterType === "PLAYER" ? 7 : 8,
        shooterType: shooterType,
        damage: shooterType === "PLAYER" ? 40 : 15
      });
    }

    function initNests() {
      nests = [
        { id: 0, x: 600, y: 700, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" },
        { id: 1, x: 1300, y: 1500, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" },
        { id: 2, x: 900, y: 2500, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" },
        { id: 3, x: 3000, y: 900, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" }
      ];
    }

    function startGame() {
      score = 0;
      gameStartTime = Date.now();
      playerHp = MAX_HP;
      playerOxygen = MAX_OXYGEN;
      isGameRunning = true;
      hasBabySpawned = false;
      entities = [];
      projectiles = [];
      player.x = 2500;
      player.y = 1600;
      player.hitCooldown = 0;

      scoreText.innerText = score;
      playerHpBar.style.width = "100%";
      playerOxygenBar.style.width = "100%";
      startOverlay.style.display = "none";

      initNests();
      spawnHaastEagleFemale();

      for (let i = 0; i < 3; i++) {
        spawnKelenvolare("♀");
        spawnKelenvolare("♂");
      }

      for (let i = 0; i < 25; i++) spawnEntity(true);

      if (spawnIntervalId) clearInterval(spawnIntervalId);
      spawnIntervalId = setInterval(() => spawnEntity(false), 1200);
    }

    function spawnHaastEagleFemale() {
      entities.push({
        x: player.x - 150 * x, y: player.y,
        baseSpeed: 6.5, speed: 6.5,
        width: 85, height: 70, type: "하스트수리(♀)",
        species: "하스트수리", gender: "♀", isBaby: false, isTarget: false,
        angle: 0, orbitAngle: 0, radiusMultiplier: 150, orbitSpeed: 0.03,
        hp: 9999, maxHp: 9999, lastShootTime: 0
      });
    }

    function spawnHaastEagleBaby() {
      entities.push({
        x: player.x + 80 * x, y: player.y + 80 * x,
        baseSpeed: 6.5, speed: 6.5,
        width: 48, height: 38, type: "하스트수리(새끼)",
        species: "하스트수리", gender: "👶", isBaby: true, isTarget: false,
        angle: 0, orbitAngle: Math.PI, radiusMultiplier: 80, orbitSpeed: 0.04,
        hp: 9999, maxHp: 9999, lastShootTime: 0
      });
    }

    function spawnKelenvolare(gender, isBaby = false) {
      entities.push({
        x: Math.random() * 1200 + 300,
        y: Math.random() * 2000 + 500,
        baseSpeed: isBaby ? 2.0 : 3.2,
        speed: isBaby ? 2.0 : 3.2,
        width: isBaby ? 60 : 120,
        height: isBaby ? 45 : 85,
        type: `켈렌불라레(${gender})${isBaby ? '(새끼)' : ''}`,
        species: "켈렌불라레",
        gender: gender,
        isBaby: isBaby,
        birthTime: Date.now(),
        isTarget: false,
        angle: Math.random() * Math.PI * 2,
        chaseState: "IDLE", chaseTimer: 0, isResting: false,
        hp: isBaby ? 60 : 160, maxHp: isBaby ? 60 : 160,
        lastShootTime: 0, clackTimer: 0
      });
    }

    function spawnEntity(inMap = false) {
      if (!isGameRunning) return;
      const rand = Math.random() * 100;
      let type = "로드리게스솔리테어";
      let isTarget = true;

      if (rand < 5) { type = "크리욜로포사우르스"; isTarget = false; }
      else if (rand < 10) { type = "하체고프테릭스"; isTarget = false; }
      else if (rand < 30) { type = "히네리아"; isTarget = true; }
      else if (rand < 60) { type = "이크티오스테가"; isTarget = true; }

      // 개편된 충돌 크기 비율
      // 하체고프테릭스: 몸집 거대화 없이 날개 폭 중심 (w: 260, h: 110)
      // 크리욜로포사우르스: 코를 키우지 않고 몸체/꼬리 2배 연장 (w: 220, h: 65)
      const entityW = type === "하체고프테릭스" ? 260 : (type === "크리욜로포사우르스" ? 220 : (type === "히네리아" ? 120 : 65));
      const entityH = type === "하체고프테릭스" ? 110 : (type === "크리욜로포사우르스" ? 65 : (type === "히네리아" ? 50 : 45));

      let spawnX = Math.random() * (MAP_WIDTH - 400) + 200;
      let spawnY = Math.random() * (MAP_HEIGHT - 400) + 200;

      if (type === "히네리아") {
        spawnX = Math.random() * 1200 + 3500;
      } else if (type !== "이크티오스테가") {
        spawnX = Math.random() * 1400 + 200;
      }

      const baseSpeed = 1.8 + Math.random() * 2.0;

      entities.push({
        x: spawnX, y: spawnY,
        baseSpeed: baseSpeed, speed: baseSpeed,
        width: entityW, height: entityH,
        type: type, species: type, isTarget: isTarget, angle: Math.random() * Math.PI * 2,
        chaseState: "IDLE", chaseTimer: 0, isResting: false, oxygen: 100, hp: 50, maxHp: 50, lastShootTime: 0
      });
    }

    function updatePlayer() {
      let dx = 0, dy = 0;
      if (keys["ArrowUp"] && player.y > 0) dy -= player.speed;
      if (keys["ArrowDown"] && player.y < MAP_HEIGHT - player.height) dy += player.speed;
      if (keys["ArrowLeft"] && player.x > 0) dx -= player.speed;
      if (keys["ArrowRight"] && player.x < MAP_WIDTH - player.width) dx += player.speed;

      player.x += dx; player.y += dy;
      if (dx !== 0 || dy !== 0) player.angle = Math.atan2(dy, dx);

      if (player.hitCooldown > 0) player.hitCooldown--;

      camera.x = Math.max(0, Math.min(MAP_WIDTH - camera.width, player.x + player.width / 2 - camera.width / 2));
      camera.y = Math.max(0, Math.min(MAP_HEIGHT - camera.height, player.y + player.height / 2 - camera.height / 2));
    }

    function checkCollision(r1, r2) {
      return (
        r1.x < r2.x + r2.width &&
        r1.x + r1.width > r2.x &&
        r1.y < r2.y + r2.height &&
        r1.y + r1.height > r2.y
      );
    }

    function update() {
      if (!isGameRunning) return;

      const now = Date.now();

      const elapsedSec = Math.floor((now - gameStartTime) / 1000);
      const isNight = (elapsedSec % 120) >= 60;
      timeStateText.innerText = isNight ? "🌙 밤" : "☀️ 낮";
      timeStateText.style.color = isNight ? "#9b59b6" : "#f1c40f";

      updatePlayer();

      if (!hasBabySpawned) {
        nests.forEach((nest) => {
          if (checkCollision(player, nest)) {
            hasBabySpawned = true;
            spawnHaastEagleBaby();
            score += 10;
            scoreText.innerText = score;
            playerHp = Math.min(MAX_HP, playerHp + 30);
            playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 30);
          }
        });
      }

      playerOxygen -= 0.03;
      if (playerOxygen <= 0) playerHp -= 0.4;
      if (playerHp <= 0) {
        isGameRunning = false;
        overlayTitle.innerText = `게임 오버! (체력 고갈 사망)`;
        startOverlay.style.display = "flex";
      }

      playerHpBar.style.width = `${(playerHp / MAX_HP) * 100}%`;
      playerOxygenBar.style.width = `${(playerOxygen / MAX_OXYGEN) * 100}%`;

      for (let pIdx = projectiles.length - 1; pIdx >= 0; pIdx--) {
        const p = projectiles[pIdx];
        p.x += p.vx; p.y += p.vy;

        if (p.x < 0 || p.x > MAP_WIDTH || p.y < 0 || p.y > MAP_HEIGHT) {
          projectiles.splice(pIdx, 1);
          continue;
        }

        if (p.shooterType === "ENEMY") {
          const distToPlayer = Math.hypot(p.x - (player.x + player.width/2), p.y - (player.y + player.height/2));
          if (distToPlayer < p.radius + 25) {
            playerHp -= p.damage;
            projectiles.splice(pIdx, 1);
            continue;
          }
        } else if (p.shooterType === "PLAYER") {
          for (let eIdx = entities.length - 1; eIdx >= 0; eIdx--) {
            const e = entities[eIdx];
            
            if (e.species === "하스트수리" || e.species === "켈렌불라레") {
              continue;
            }

            const eRect = { x: e.x, y: e.y, width: e.width, height: e.height };
            const pRect = { x: p.x - p.radius, y: p.y - p.radius, width: p.radius*2, height: p.radius*2 };

            if (checkCollision(pRect, eRect)) {
              e.hp -= p.damage;
              projectiles.splice(pIdx, 1);

              if (e.hp <= 0) {
                if (e.type === "하체고프테릭스" || e.type === "크리욜로포사우르스") {
                  score += 5;
                } else score += 1;
                scoreText.innerText = score;
                entities.splice(eIdx, 1);
              }
              break;
            }
          }
        }
      }

      for (let i = entities.length - 1; i >= 0; i--) {
        const e = entities[i];

        if (e.species === "켈렌불라레" && e.isBaby) {
          if (now - e.birthTime >= 30000) {
            e.isBaby = false;
            e.width = 120;
            e.height = 85;
            e.speed = 3.2;
            e.type = `켈렌불라레(${e.gender})`;
          }
        }

        const pCenterX = player.x + player.width / 2;
        const pCenterY = player.y + player.height / 2;
        const eCenterX = e.x + e.width / 2;
        const eCenterY = e.y + e.height / 2;

        const dx = pCenterX - eCenterX;
        const dy = pCenterY - eCenterY;
        const distance = Math.hypot(dx, dy);

        if (e.species === "하스트수리" && e !== player) {
          e.orbitAngle = (e.orbitAngle || 0) + (e.orbitSpeed || 0.03);

          const currentRadius = e.radiusMultiplier * x;
          const targetX = pCenterX + Math.cos(e.orbitAngle) * currentRadius - e.width / 2;
          const targetY = pCenterY + Math.sin(e.orbitAngle) * currentRadius - e.height / 2;

          e.angle = e.orbitAngle + Math.PI / 2;

          e.x += (targetX - e.x) * 0.15;
          e.y += (targetY - e.y) * 0.15;

          if (e.gender === "♀") {
            for (let j = entities.length - 1; j >= 0; j--) {
              const other = entities[j];
              if (other !== e && other.species !== "하스트수리" && other.species !== "켈렌불라레" && other.isTarget === false) {
                if (checkCollision(e, other)) {
                  other.hp = 0;
                  score += 5;
                  scoreText.innerText = score;
                  entities.splice(j, 1);
                  if (j < i) i--;
                }
              }
            }
          }
          continue;
        }

        if (e.species === "켈렌불라레" && !e.isBaby) {
          for (let j = 0; j < entities.length; j++) {
            const partner = entities[j];
            if (partner.species === "켈렌불라레" && partner.gender !== e.gender && !partner.isBaby) {
              const kDist = Math.hypot(partner.x - e.x, partner.y - e.y);
              if (kDist < 120) {
                e.clackTimer = (e.clackTimer || 0) + 1;
                if (e.clackTimer > 300) {
                  e.clackTimer = 0;
                  const babyGender = Math.random() < 0.5 ? "♀" : "♂";
                  spawnKelenvolare(babyGender, true);
                }
              }
            }
          }
        }

        if (!e.isTarget && e.species !== "하스트수리" && e.species !== "켈렌불라레") {
          if (e.chaseState === "IDLE" && distance < 280) {
            e.chaseState = "CHASING";
            e.chaseTimer = now;
            e.isResting = false;
          }

          if (e.chaseState === "CHASING") {
            if (!e.isResting) {
              const targetAngle = Math.atan2(dy, dx);
              e.angle = targetAngle;
              e.x += Math.cos(targetAngle) * (e.speed + 1.2);
              e.y += Math.sin(targetAngle) * (e.speed + 1.2);

              if (now - e.lastShootTime > 2000 && distance < 380) {
                shootPoison(e, "ENEMY");
                e.lastShootTime = now;
              }

              if (now - e.chaseTimer > 5000) {
                e.isResting = true;
                e.chaseTimer = now;
              }
            } 
            else {
              if (now - e.chaseTimer > 1000) {
                e.isResting = false;
                e.chaseTimer = now;

                if (distance >= 280) {
                  e.chaseState = "IDLE";
                }
              }
            }
          } else {
            e.angle += (Math.random() - 0.5) * (Math.PI / 45);
            e.x += Math.cos(e.angle) * e.speed;
            e.y += Math.sin(e.angle) * e.speed;
          }
        } else if (e.isTarget || e.species === "켈렌불라레") {
          if (distance < 150 && e.isTarget) {
            e.chaseState = "FLEEING"; e.angle = Math.atan2(-dy, -dx);
          } else e.chaseState = "IDLE";

          const currentSpeed = e.chaseState === "FLEEING" ? e.speed * 1.5 : e.speed;
          if (e.chaseState === "IDLE") e.angle += (Math.random() - 0.5) * (Math.PI / 45);

          e.x += Math.cos(e.angle) * currentSpeed;
          e.y += Math.sin(e.angle) * currentSpeed;
        }

        if (e.x <= 0) { e.x = 0; e.angle = Math.PI - e.angle; }
        else if (e.x + e.width >= MAP_WIDTH) { e.x = MAP_WIDTH - e.width; e.angle = Math.PI - e.angle; }
        if (e.y <= 0) { e.y = 0; e.angle = -e.angle; }
        else if (e.y + e.height >= MAP_HEIGHT) { e.y = MAP_HEIGHT - e.height; e.angle = -e.angle; }

        if (e.species !== "이크티오스테가") {
          const inWater = isWaterArea(e.x, e.y, e.width, e.height);
          if (e.type === "히네리아") {
            if (!inWater) {
              e.x -= Math.cos(e.angle) * (e.speed + 2);
              e.y -= Math.sin(e.angle) * (e.speed + 2);
              e.angle += Math.PI;
            }
          } else {
            if (inWater) {
              e.x -= Math.cos(e.angle) * (e.speed + 2);
              e.y -= Math.sin(e.angle) * (e.speed + 2);
              e.angle += Math.PI;
            }
          }
        }

        if (checkCollision(player, e)) {
          if (e.isTarget) {
            score += 1; scoreText.innerText = score;
            playerHp = Math.min(MAX_HP, playerHp + 15);
            playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 25);
            entities.splice(i, 1);
          } else if (e.species !== "하스트수리" && e.species !== "켈렌불라레") {
            if (player.hitCooldown <= 0) {
              playerHp -= 15;
              player.hitCooldown = 25;
              const knockAngle = Math.atan2(pCenterY - eCenterY, pCenterX - eCenterX);
              player.x += Math.cos(knockAngle) * 60;
              player.y += Math.sin(knockAngle) * 60;
            }
          }
        }
      }
    }

    function drawMapBackground() {
      const oceanGrad = ctx.createLinearGradient(3400 - camera.x, 0, MAP_WIDTH - camera.x, 0);
      oceanGrad.addColorStop(0, "#1e5f74");
      oceanGrad.addColorStop(1, "#0b3c4d");
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(3400 - camera.x, 0 - camera.y, 1600, MAP_HEIGHT);

      const forestGrad = ctx.createLinearGradient(0 - camera.x, 0, 3400 - camera.x, 0);
      forestGrad.addColorStop(0, "#2d4d2d");
      forestGrad.addColorStop(1, "#385e38");
      ctx.fillStyle = forestGrad;
      ctx.fillRect(0 - camera.x, 0 - camera.y, 3400, MAP_HEIGHT);

      ctx.fillStyle = "rgba(15, 35, 15, 0.4)";
      for (let i = 100; i < MAP_HEIGHT; i += 300) {
        ctx.beginPath();
        ctx.arc(400 - camera.x, i - camera.y, 140, 0, Math.PI * 2);
        ctx.arc(1400 - camera.x, i + 100 - camera.y, 160, 0, Math.PI * 2);
        ctx.arc(2800 - camera.x, i + 50 - camera.y, 150, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#2980b9";
      ctx.beginPath();
      ctx.moveTo(1900 - camera.x, 0 - camera.y);
      ctx.bezierCurveTo(1600 - camera.x, 800 - camera.y, 2400 - camera.x, 2000 - camera.x, 2000 - camera.x, MAP_HEIGHT - camera.y);
      ctx.lineTo(2500 - camera.x, MAP_HEIGHT - camera.y);
      ctx.bezierCurveTo(2800 - camera.x, 2000 - camera.y, 2000 - camera.x, 800 - camera.y, 2400 - camera.x, 0 - camera.y);
      ctx.closePath();
      ctx.fill();
    }

    function drawNests() {
      nests.forEach((nest) => {
        const nx = nest.x - camera.x;
        const ny = nest.y - camera.y;
        ctx.fillStyle = "#8d6e63";
        ctx.beginPath();
        ctx.ellipse(nx, ny, 35, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        if (nest.hasEgg) {
          ctx.fillStyle = nest.eggState === "FERTILIZED" ? "#2ecc71" : "#fff8e1";
          ctx.beginPath();
          ctx.ellipse(nx - 6, ny - 2, 8, 11, 0, 0, Math.PI * 2);
          ctx.ellipse(nx + 6, ny - 2, 8, 11, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    // 🦅 1. 하스트 수리
    function drawHaastEagle(w, h, isBaby = false) {
      ctx.fillStyle = isBaby ? "#8d6e63" : "#3e2723";
      
      ctx.beginPath();
      ctx.moveTo(w * 0.05, -h * 0.1);
      ctx.quadraticCurveTo(-w * 0.1, -h * 0.55, -w * 0.38, -h * 0.45);
      ctx.quadraticCurveTo(-w * 0.15, -h * 0.25, w * 0.15, -h * 0.1);
      ctx.closePath(); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(w * 0.05, h * 0.1);
      ctx.quadraticCurveTo(-w * 0.1, h * 0.55, -w * 0.38, h * 0.45);
      ctx.quadraticCurveTo(-w * 0.15, h * 0.25, w * 0.15, h * 0.1);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#2d1b18";
      ctx.beginPath();
      ctx.moveTo(-w * 0.25, -h * 0.1); ctx.lineTo(-w * 0.45, 0); ctx.lineTo(-w * 0.25, h * 0.1);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = isBaby ? "#a1887f" : "#4e342e";
      ctx.beginPath(); ctx.ellipse(-w * 0.05, 0, w * 0.35, h * 0.24, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = isBaby ? "#d7ccc8" : "#795548";
      ctx.beginPath(); ctx.arc(w * 0.22, 0, h * 0.2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#f39c12";
      ctx.beginPath();
      ctx.moveTo(w * 0.32, -h * 0.1); ctx.lineTo(w * 0.55, 0); ctx.lineTo(w * 0.32, h * 0.1);
      ctx.closePath(); ctx.fill();
    }

    // 🦇 ★ [개편] 하체고프테릭스 (몸체 거대화 없이 '날개만 길게 뻗은' 탑다운 렌더링) ★
    function drawHatzegopteryx(w, h, state) {
      const bodyColor = state === "CHASING" ? "#5d4037" : "#3e2723";
      const membraneColor = state === "CHASING" ? "#a93226" : "#6e2c00";

      // 위쪽 길게 뻗은 날개막 (몸체 대비 날개를 2.5배 널찍하게 뻗음)
      ctx.fillStyle = membraneColor;
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.08);
      ctx.lineTo(-w * 0.1, -h * 0.95); // 날개 끝까지 길게 연장
      ctx.quadraticCurveTo(-w * 0.15, -h * 0.45, -w * 0.35, -h * 0.08);
      ctx.closePath(); ctx.fill();

      // 아래쪽 길게 뻗은 날개막
      ctx.beginPath();
      ctx.moveTo(0, h * 0.08);
      ctx.lineTo(-w * 0.1, h * 0.95);
      ctx.quadraticCurveTo(-w * 0.15, h * 0.45, -w * 0.35, h * 0.08);
      ctx.closePath(); ctx.fill();

      // 날개 외측 메인 손가락 뼈대
      ctx.strokeStyle = "#d4ac0d"; ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.08); ctx.lineTo(-w * 0.1, -h * 0.95);
      ctx.moveTo(0, h * 0.08); ctx.lineTo(-w * 0.1, h * 0.95);
      ctx.stroke();

      // 적절한 크기의 몸통 & 익룡 목 (거인이 아닌 비율)
      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.ellipse(-w * 0.15, 0, w * 0.15, h * 0.14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-w * 0.05, -h * 0.08); ctx.lineTo(w * 0.15, -h * 0.07);
      ctx.lineTo(w * 0.15, h * 0.07); ctx.lineTo(-w * 0.05, h * 0.08);
      ctx.closePath(); ctx.fill();

      // 직선형 부리
      ctx.fillStyle = "#d4ac0d";
      ctx.beginPath();
      ctx.moveTo(w * 0.12, -h * 0.07); ctx.lineTo(w * 0.45, 0); ctx.lineTo(w * 0.12, h * 0.07);
      ctx.closePath(); ctx.fill();
    }

    // 🦖 ★ [개편] 크리욜로포사우르스 (코쟁이 제거, 몸통과 꼬리만 2배 연장) ★
    function drawCryolophosaurus(w, h, state) {
      const bodyColor = state === "CHASING" ? "#d35400" : "#887711";

      // 2배로 길어진 척추 꼬리
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.moveTo(-w * 0.05, -h * 0.16);
      ctx.lineTo(-w * 0.65, 0); // 꼬리 2배 연장
      ctx.lineTo(-w * 0.05, h * 0.16);
      ctx.closePath(); ctx.fill();

      // 2배로 길어진 중앙 몸통 및 골반
      ctx.beginPath(); ctx.ellipse(-w * 0.15, 0, w * 0.28, h * 0.35, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(w * 0.08, 0, w * 0.22, h * 0.24, 0, 0, Math.PI * 2); ctx.fill();

      // 표준 비율 주둥이 (코가 과하게 길지 않은 고증 형태)
      ctx.beginPath();
      ctx.moveTo(w * 0.18, -h * 0.14); ctx.lineTo(w * 0.38, 0); ctx.lineTo(w * 0.18, h * 0.14);
      ctx.closePath(); ctx.fill();

      // 크리욜로포 특유의 부채형 가로 벼슬
      ctx.fillStyle = "#e74c3c";
      ctx.beginPath(); ctx.ellipse(w * 0.2, 0, w * 0.04, h * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    }

    // 🦤 4. 켈렌불라레
    function drawKelenvolare(w, h, clackTimer = 0) {
      ctx.fillStyle = "#2c221e";
      ctx.beginPath();
      ctx.moveTo(-w * 0.25, -h * 0.12); ctx.lineTo(-w * 0.48, 0); ctx.lineTo(-w * 0.25, h * 0.12);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#4a3b32";
      ctx.beginPath(); ctx.ellipse(-w * 0.05, 0, w * 0.32, h * 0.25, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#8b4513"; ctx.strokeStyle = "#2b1810"; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-w * 0.08, -h * 0.1);
      ctx.quadraticCurveTo(-w * 0.48, -h * 0.9, w * 0.15, -h * 0.7);
      ctx.quadraticCurveTo(-w * 0.05, -h * 0.35, -w * 0.08, -h * 0.1);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-w * 0.08, h * 0.1);
      ctx.quadraticCurveTo(-w * 0.48, h * 0.9, w * 0.15, h * 0.7);
      ctx.quadraticCurveTo(-w * 0.05, h * 0.35, -w * 0.08, h * 0.1);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#362a24";
      ctx.beginPath(); ctx.ellipse(w * 0.18, 0, w * 0.15, h * 0.14, 0, 0, Math.PI * 2); ctx.fill();

      const offset = (clackTimer % 4 > 2) ? 4 : 0;
      ctx.fillStyle = "#d4c585";
      ctx.beginPath();
      ctx.moveTo(w * 0.26, -h * 0.1 - offset); ctx.lineTo(w * 0.55, 0); ctx.lineTo(w * 0.26, h * 0.1 + offset);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#2c2a29";
      ctx.beginPath();
      ctx.moveTo(w * 0.45, -h * 0.05); ctx.lineTo(w * 0.55, 0); ctx.lineTo(w * 0.45, h * 0.05);
      ctx.closePath(); ctx.fill();
    }

    // 🕊️ 5. 로드리게스 솔리테어
    function drawSolitaire(w, h) {
      ctx.fillStyle = "#d4ac0d";
      ctx.beginPath(); ctx.ellipse(0, 0, w * 0.35, h * 0.3, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.ellipse(w * 0.02, 0, w * 0.2, h * 0.18, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#d4ac0d";
      ctx.beginPath(); ctx.arc(w * 0.24, 0, h * 0.18, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#17202a";
      ctx.beginPath();
      ctx.moveTo(w * 0.32, -h * 0.08); ctx.lineTo(w * 0.52, 0); ctx.lineTo(w * 0.32, h * 0.08);
      ctx.closePath(); ctx.fill();
    }

    // 🐟 6. 히네리아
    function drawHyneria(w, h) {
      ctx.fillStyle = "#5dade2";
      ctx.beginPath(); ctx.ellipse(0, 0, w * 0.42, h * 0.22, 0, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = "#1b4f72"; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-w * 0.3, 0); ctx.lineTo(w * 0.25, 0);
      ctx.stroke();

      ctx.fillStyle = "#3498db";
      ctx.beginPath();
      ctx.ellipse(-w * 0.05, -h * 0.28, w * 0.12, h * 0.14, 0, 0, Math.PI * 2);
      ctx.ellipse(-w * 0.05, h * 0.28, w * 0.12, h * 0.14, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#2874a6";
      ctx.beginPath();
      ctx.moveTo(-w * 0.38, -h * 0.2); ctx.lineTo(-w * 0.52, 0); ctx.lineTo(-w * 0.38, h * 0.2);
      ctx.closePath(); ctx.fill();
    }

    // 🦎 7. 이크티오스테가
    function drawIchthyostega(w, h) {
      ctx.fillStyle = "#5d4037";
      ctx.beginPath();
      ctx.moveTo(-w * 0.15, -h * 0.12);
      ctx.quadraticCurveTo(-w * 0.38, -h * 0.05, -w * 0.5, 0);
      ctx.quadraticCurveTo(-w * 0.38, h * 0.05, -w * 0.15, h * 0.12);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#6e2c00";
      ctx.beginPath(); ctx.ellipse(-w * 0.05, 0, w * 0.28, h * 0.22, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#421b00";
      ctx.beginPath();
      ctx.rect(-w * 0.2, -h * 0.4, w * 0.1, h * 0.2);
      ctx.rect(w * 0.05, -h * 0.4, w * 0.1, h * 0.2);
      ctx.rect(-w * 0.2, h * 0.2, w * 0.1, h * 0.2);
      ctx.rect(w * 0.05, h * 0.2, w * 0.1, h * 0.2);
      ctx.fill();

      ctx.fillStyle = "#795548";
      ctx.beginPath(); ctx.ellipse(w * 0.22, 0, w * 0.18, h * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMapBackground();
      drawNests();

      projectiles.forEach((p) => {
        ctx.fillStyle = p.shooterType === "PLAYER" ? "#2ecc71" : "#e74c3c";
        ctx.beginPath(); ctx.arc(p.x - camera.x, p.y - camera.y, p.radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();
      });

      if (player.hitCooldown % 4 < 2) {
        ctx.save();
        ctx.translate(player.x + player.width / 2 - camera.x, player.y + player.height / 2 - camera.y);
        ctx.rotate(player.angle);
        drawHaastEagle(player.width, player.height, false);
        ctx.restore();
      }

      entities.forEach((e) => {
        if (
          e.x + e.width > camera.x && e.x < camera.x + camera.width &&
          e.y + e.height > camera.y && e.y < camera.y + camera.height
        ) {
          const screenX = e.x + e.width / 2 - camera.x;
          const screenY = e.y + e.height / 2 - camera.y;

          ctx.save();
          ctx.translate(screenX, screenY);
          ctx.rotate(e.angle);

          if (e.species === "하스트수리") drawHaastEagle(e.width, e.height, e.isBaby);
          else if (e.species === "켈렌불라레") drawKelenvolare(e.width, e.height, e.clackTimer);
          else if (e.type === "크리욜로포사우르스") drawCryolophosaurus(e.width, e.height, e.chaseState);
          else if (e.type === "하체고프테릭스") drawHatzegopteryx(e.width, e.height, e.chaseState);
          else if (e.type === "로드리게스솔리테어") drawSolitaire(e.width, e.height);
          else if (e.type === "히네리아") drawHyneria(e.width, e.height);
          else if (e.type === "이크티오스테가") drawIchthyostega(e.width, e.height);

          ctx.restore();

          if (e.species !== "하스트수리" && e.species !== "켈렌불라레") {
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(screenX - 25, screenY - e.height / 2 - 14, 50, 5);
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(screenX - 25, screenY - e.height / 2 - 14, (e.hp / e.maxHp) * 50, 5);
          }

          ctx.font = "bold 13px Arial";
          ctx.fillStyle = (e.species === "하스트수리") ? (e.isBaby ? "#f1c40f" : "#ff79c6") : (e.species === "켈렌불라레" ? "#9b59b6" : "#ffffff");
          ctx.fillText(`${e.type}${e.isResting ? ' (휴식)' : ''}`, screenX - 25, screenY - e.height / 2 - 20);
        }
      });

      const elapsedSec = Math.floor((Date.now() - gameStartTime) / 1000);
      const isNight = (elapsedSec % 120) >= 60;

      if (isNight) {
        ctx.save();
        ctx.fillStyle = "rgba(10, 15, 35, 0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const pScreenX = player.x + player.width / 2 - camera.x;
        const pScreenY = player.y + player.height / 2 - camera.y;

        const lightGrad = ctx.createRadialGradient(pScreenX, pScreenY, 30, pScreenX, pScreenY, 260);
        lightGrad.addColorStop(0, "rgba(255, 240, 200, 0.25)");
        lightGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = lightGrad;
        ctx.beginPath();
        ctx.arc(pScreenX, pScreenY, 260, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
