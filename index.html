<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>하스트수리의 삶</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0f14;
      color: #f5f6fa;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 1120px;
      aspect-ratio: 16 / 9;
      max-height: 94dvh;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.14);
      background-color: #162218;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #hud-top {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 5;
    }

    .hud-group {
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(12, 16, 20, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #a4b0be;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }

    .bar-track {
      width: 110px;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    #playerHpBar {
      width: 100%;
      height: 100%;
      background: #ff4757;
      border-radius: 4px;
      transition: width 0.15s ease;
    }

    #playerOxygenBar {
      width: 100%;
      height: 100%;
      background: #1e90ff;
      border-radius: 4px;
      transition: width 0.15s ease;
    }

    .info-pill {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f1f2f6;
      padding: 0 6px;
    }

    #help-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #help-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    #touch-controls {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      z-index: 5;
      opacity: 0.75;
      transition: opacity 0.2s;
    }

    #touch-controls:hover {
      opacity: 1;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(2, 40px);
      gap: 4px;
    }

    .ctrl-btn {
      background: rgba(12, 16, 20, 0.7);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .ctrl-btn:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }

    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    #btn-attack {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255, 165, 2, 0.28);
      backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255, 165, 2, 0.7);
      color: #ffa502;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #btn-attack:active {
      background: rgba(255, 165, 2, 0.5);
      transform: scale(0.94);
    }

    #start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 18, 0.86);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }

    #overlay-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a4b0be;
      margin: 0 0 20px 0;
    }

    .simple-guide {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 16px 24px;
      margin-bottom: 22px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 11px;
      font-size: 0.96rem;
      line-height: 1.45;
      max-width: 680px;
    }

    .guide-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .guide-badge {
      background: rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #ffa502;
      min-width: 86px;
      text-align: center;
      flex-shrink: 0;
    }

    #start-btn {
      padding: 12px 42px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f1419;
      background-color: #ffa502;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 165, 2, 0.35);
      transition: transform 0.15s, background-color 0.15s;
    }

    #start-btn:hover {
      background-color: #ffb142;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <canvas id="gameCanvas" width="1024" height="576"></canvas>

    <div id="hud-top">
      <div class="hud-group">
        <div class="stat-item">
          <div class="stat-label"><span>체력</span><span id="hpNumText">100</span></div>
          <div class="bar-track"><div id="playerHpBar"></div></div>
        </div>
        <div class="stat-item">
          <div class="stat-label"><span>산소</span><span id="oxyNumText">100</span></div>
          <div class="bar-track"><div id="playerOxygenBar"></div></div>
        </div>
      </div>

      <div class="hud-group">
        <span class="info-pill" id="terrainText">🌲 숲</span>
        <span class="info-pill" id="timeStateText">☀️ 낮</span>
        <span class="info-pill">점수 <strong id="scoreText" style="color: #ffa502;">0</strong></span>
        <button id="help-btn" onclick="openHelp()">?</button>
      </div>
    </div>

    <div id="touch-controls">
      <div class="dpad">
        <div class="ctrl-btn" id="btn-up">W</div>
        <div class="ctrl-btn" id="btn-left">A</div>
        <div class="ctrl-btn" id="btn-down">S</div>
        <div class="ctrl-btn" id="btn-right">D</div>
      </div>
      <div id="btn-attack">🦅<br>발톱 공격</div>
    </div>

    <div id="start-overlay">
      <h1 id="overlay-title">🦅 하스트수리의 삶</h1>
      <p class="subtitle">자생 번식과 먹이사슬이 살아 움직이는 생태계</p>

      <div class="simple-guide">
        <div class="guide-row">
          <span class="guide-badge">움직이기</span>
          <span><b>W, A, S, D</b> 키 (또는 화살표 키)로 날아다녀요.</span>
        </div>
        <div class="guide-row">
          <span class="guide-badge">투구게 일생</span>
          <span>강과 바다에서 해조류를 먹고 자라 <b>성숙해지면 모래톱으로 올라와</b> 수정액을 뿌리고 <b>알 5개</b>를 산란해요.</span>
        </div>
        <div class="guide-row">
          <span class="guide-badge">틸로사우르스</span>
          <span>바다에서만 살아가는 <b>죽지 않는 최상위 해양 포식자</b>로, 오로지 바다의 투구게만 사냥해요.</span>
        </div>
        <div class="guide-row">
          <span class="guide-badge">사냥 방법</span>
          <span>스쳐 지나가면 먹지 않아요! 먹이를 사냥하려면 반드시 <b>스페이스바(발톱 공격)</b>를 누르세요.</span>
        </div>
      </div>

      <button id="start-btn" onclick="handleStartOrResume()">게임 시작</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const terrainText = document.getElementById("terrainText");
    const timeStateText = document.getElementById("timeStateText");
    const scoreText = document.getElementById("scoreText");
    const playerHpBar = document.getElementById("playerHpBar");
    const playerOxygenBar = document.getElementById("playerOxygenBar");
    const hpNumText = document.getElementById("hpNumText");
    const oxyNumText = document.getElementById("oxyNumText");
    const startOverlay = document.getElementById("start-overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const startBtn = document.getElementById("start-btn");

    const x = 1.0;

    const MAP_WIDTH = 5000;
    const MAP_HEIGHT = 3200;

    const RIVER_START = 1950;
    const RIVER_END = 2450;
    const RIVER_SAND_WIDTH = 95;
    const OCEAN_START = 3400;
    const OCEAN_SAND_WIDTH = 260;

    const KELENVOLARE_LIFESPAN = 180000;
    const HORSESHOE_LIFESPAN = 130000;

    const MAX_CRYOLOPHOSAURUS = 3;
    const MAX_HATZEGOPTERYX = 3;
    const MAX_TYLOSAURUS = 2;
    const MIN_HORSESHOE_CRABS = 14;
    const MAX_HORSESHOE_CRABS = 40;

    const FOOD_CHAIN_RANK = {
      "로드리게스솔리테어": 1,
      "투구게": 1,
      "이크티오스테가": 2,
      "히네리아": 3,
      "하체고프테릭스": 4,
      "켈렌불라레": 5,
      "크리욜로포사우르스": 6,
      "틸로사우르스": 7
    };

    const camera = { x: 0, y: 0, width: canvas.width, height: canvas.height };

    let score = 0;
    let gameStartTime = 0;
    let lastUpdateTime = 0;
    let isGameRunning = false;
    let isPausedForHelp = false;
    let spawnIntervalId = null;

    let playerHp = 100;
    const MAX_HP = 100;
    let playerOxygen = 100;
    const MAX_OXYGEN = 100;

    const player = {
      x: 1650, y: 1600, width: 85, height: 70, speed: 6.5, angle: 0,
      species: "하스트수리", gender: "♂", hitCooldown: 0,
      clawTimer: 0, clawCooldown: 0
    };

    const keys = {};
    let clawEffects = [];
    let entities = [];
    let nests = [];
    let trees = [];
    let spermZones = [];
    let seaweeds = [];
    let hasBabySpawned = false;

    window.addEventListener("keydown", (e) => {
      const code = e.code;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "KeyW", "KeyA", "KeyS", "KeyD"].includes(code)) {
        e.preventDefault();
      }
      keys[code] = true;

      if (code === "Space" && isGameRunning) {
        triggerClawAttack();
      }
    });
    
    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    function setupTouchButton(buttonId, keyCode) {
      const btn = document.getElementById(buttonId);
      const press = (e) => { e.preventDefault(); keys[keyCode] = true; };
      const release = (e) => { e.preventDefault(); keys[keyCode] = false; };
      btn.addEventListener("touchstart", press, { passive: false });
      btn.addEventListener("touchend", release, { passive: false });
      btn.addEventListener("mousedown", press);
      btn.addEventListener("mouseup", release);
      btn.addEventListener("mouseleave", release);
    }

    setupTouchButton("btn-up", "KeyW");
    setupTouchButton("btn-down", "KeyS");
    setupTouchButton("btn-left", "KeyA");
    setupTouchButton("btn-right", "KeyD");

    document.getElementById("btn-attack").addEventListener("click", () => {
      if (isGameRunning) triggerClawAttack();
    });

    function openHelp() {
      if (!isGameRunning) return;
      isPausedForHelp = true;
      isGameRunning = false;
      overlayTitle.innerText = "🦅 게임 방법";
      startBtn.innerText = "계속하기";
      startOverlay.style.display = "flex";
    }

    function handleStartOrResume() {
      if (isPausedForHelp) {
        isPausedForHelp = false;
        isGameRunning = true;
        lastUpdateTime = Date.now();
        startOverlay.style.display = "none";
      } else {
        startGame();
      }
    }

    function isOceanArea(px, py, width = 0) {
      return (px + width >= OCEAN_START);
    }

    function isStrictlyInOcean(px, width = 0) {
      return (px >= OCEAN_START + 8 && px + width <= MAP_WIDTH - 8);
    }

    function isRiverArea(px, py, width = 0) {
      return (px + width >= RIVER_START && px <= RIVER_END);
    }

    function isWaterArea(px, py, width = 0) {
      return isOceanArea(px, py, width) || isRiverArea(px, py, width);
    }

    function isSandbarArea(px, py, width = 0) {
      const center = px + width / 2;
      const inWestRiverSand = (center >= RIVER_START - RIVER_SAND_WIDTH && center <= RIVER_START + 15);
      const inEastRiverSand = (center >= RIVER_END - 15 && center <= RIVER_END + RIVER_SAND_WIDTH);
      const inOceanSand = (center >= OCEAN_START - OCEAN_SAND_WIDTH && center <= OCEAN_START + 25);
      return inWestRiverSand || inEastRiverSand || inOceanSand;
    }

    function getNearestSandbarX(centerX) {
      const westRiverSandX = RIVER_START - RIVER_SAND_WIDTH / 2;
      const eastRiverSandX = RIVER_END + RIVER_SAND_WIDTH / 2;
      const oceanSandX = OCEAN_START - OCEAN_SAND_WIDTH / 2;

      const d1 = Math.abs(centerX - westRiverSandX);
      const d2 = Math.abs(centerX - eastRiverSandX);
      const d3 = Math.abs(centerX - oceanSandX);

      if (d1 <= d2 && d1 <= d3) return westRiverSandX;
      if (d2 <= d1 && d2 <= d3) return eastRiverSandX;
      return oceanSandX;
    }

    function getNearestWaterX(centerX) {
      const riverCenterX = (RIVER_START + RIVER_END) / 2;
      const oceanEntryX = OCEAN_START + 120;
      return Math.abs(centerX - riverCenterX) < Math.abs(centerX - oceanEntryX) ? riverCenterX : oceanEntryX;
    }

    function spawnSeaweed(customX = null, customY = null) {
      let sx = customX;
      let sy = customY;
      if (sx === null || sy === null) {
        if (Math.random() < 0.45) {
          sx = RIVER_START + 15 + Math.random() * (RIVER_END - RIVER_START - 30);
        } else {
          sx = OCEAN_START + 20 + Math.random() * (MAP_WIDTH - OCEAN_START - 60);
        }
        sy = 120 + Math.random() * (MAP_HEIGHT - 240);
      }

      seaweeds.push({
        x: sx,
        y: sy,
        radius: 14 + Math.random() * 6,
        swayOffset: Math.random() * Math.PI * 2
      });
    }

    function initTrees() {
      trees = [];
      for (let i = 0; i < 65; i++) {
        trees.push({
          x: 90 + Math.random() * (RIVER_START - RIVER_SAND_WIDTH - 160),
          y: 120 + Math.random() * (MAP_HEIGHT - 200),
          scale: 0.8 + Math.random() * 0.55
        });
      }
      for (let i = 0; i < 32; i++) {
        trees.push({
          x: RIVER_END + RIVER_SAND_WIDTH + 60 + Math.random() * (OCEAN_START - OCEAN_SAND_WIDTH - (RIVER_END + RIVER_SAND_WIDTH) - 120),
          y: 120 + Math.random() * (MAP_HEIGHT - 200),
          scale: 0.8 + Math.random() * 0.55
        });
      }
      trees.sort((a, b) => a.y - b.y);
    }

    function triggerClawAttack() {
      if (player.clawCooldown > 0) return;

      player.clawTimer = 14;
      player.clawCooldown = 28;

      const pCenterX = player.x + player.width / 2;
      const pCenterY = player.y + player.height / 2;
      const hitX = pCenterX + Math.cos(player.angle) * 55;
      const hitY = pCenterY + Math.sin(player.angle) * 55;

      clawEffects.push({
        x: hitX,
        y: hitY,
        angle: player.angle,
        life: 14,
        maxLife: 14
      });

      for (let i = entities.length - 1; i >= 0; i--) {
        const e = entities[i];
        if (e.species === "하스트수리") continue;
        // 틸로사우르스는 죽지 않는 무적 생물이므로 피해를 입지 않음
        if (e.species === "틸로사우르스" || e.isImmortal) continue;
        if (e.species === "투구게" && e.stage === "EGG") continue;

        const eCenterX = e.x + e.width / 2;
        const eCenterY = e.y + e.height / 2;
        const dist = Math.hypot(hitX - eCenterX, hitY - eCenterY);

        if (dist < Math.max(e.width, e.height) * 0.55 + 50) {
          if (e.isTarget) {
            e.hp = 0;
          } else {
            e.hp -= 45;
            e.x += Math.cos(player.angle) * 35;
            e.y += Math.sin(player.angle) * 35;

            if (e.species === "켈렌불라레") {
              e.fleeUntil = Date.now() + 4000;
            } else {
              e.chaseState = "CHASING";
              e.chaseTimer = Date.now();
            }
          }

          if (e.hp <= 0) {
            if (e.species === "켈렌불라레") {
              score += e.isBaby ? 2 : 4;
              playerHp = Math.min(MAX_HP, playerHp + (e.isBaby ? 20 : 35));
              playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 30);
            } else if (e.species === "투구게") {
              score += 2;
              playerHp = Math.min(MAX_HP, playerHp + 20);
              playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 20);
            } else if (e.isTarget) {
              score += 1;
              playerHp = Math.min(MAX_HP, playerHp + 15);
              playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 25);
            } else {
              score += 5;
            }
            scoreText.innerText = score;
            entities.splice(i, 1);
          }
        }
      }
    }

    function initNests() {
      nests = [
        { id: 0, x: 600, y: 700, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" },
        { id: 1, x: 1300, y: 1500, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" },
        { id: 2, x: 900, y: 2500, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" },
        { id: 3, x: 2850, y: 900, width: 70, height: 70, hasEgg: true, eggState: "FERTILIZED" }
      ];
    }

    function spawnHorseshoeCrab(gender = null, stage = "ADULT", customX = null, customY = null, initialAgeMs = null) {
      const crabGender = gender || (Math.random() < 0.5 ? "♀" : "♂");
      let ageMs = initialAgeMs;
      if (ageMs === null) {
        if (stage === "EGG") ageMs = 0;
        else if (stage === "BABY") ageMs = 10000;
        else ageMs = 30000 + Math.random() * 12000;
      }

      const sizeByStage = {
        "EGG": [24, 24],
        "BABY": [36, 22],
        "ADULT": [58, 34]
      };
      const [entityW, entityH] = sizeByStage[stage];

      let spawnX = customX;
      let spawnY = customY;

      if (spawnX === null || spawnY === null) {
        if (Math.random() < 0.45) {
          spawnX = (RIVER_START + 12) + Math.random() * (RIVER_END - RIVER_START - entityW - 24);
        } else {
          spawnX = (OCEAN_START + 12) + Math.random() * (MAP_WIDTH - OCEAN_START - entityW - 40);
        }
        spawnY = 160 + Math.random() * (MAP_HEIGHT - 320);
      }

      const baseSpeed = stage === "EGG" ? 0 : (stage === "BABY" ? 1.25 : 1.65 + Math.random() * 0.45);
      const initialMaturity = stage === "ADULT" ? Math.min(100, ((ageMs - 30000) / 1000) * 10) : 0;

      entities.push({
        x: spawnX,
        y: spawnY,
        baseSpeed: baseSpeed,
        speed: baseSpeed,
        width: entityW,
        height: entityH,
        type: stage === "EGG" ? "🥚투구게 알" : (stage === "BABY" ? `투구게(${crabGender}) 새끼` : `투구게(${crabGender})`),
        species: "투구게",
        gender: crabGender,
        stage: stage,
        birthTime: Date.now() - ageMs,
        hunger: 90 + Math.random() * 10,
        maturity: initialMaturity,
        isDead: false,
        lastLayTime: 0,
        isTarget: true,
        angle: Math.random() * Math.PI * 2,
        chaseState: "IDLE",
        chaseTimer: 0,
        isResting: false,
        hp: stage === "BABY" ? 30 : 50,
        maxHp: stage === "BABY" ? 30 : 50
      });
    }

    function spawnTylosaurus(customX = null, customY = null) {
      const entityW = 310;
      const entityH = 96;
      let spawnX = customX;
      let spawnY = customY;

      if (spawnX === null || spawnY === null) {
        // 오직 바다 영역(OCEAN_START + 40 이상)에서만 스폰
        spawnX = OCEAN_START + 60 + Math.random() * (MAP_WIDTH - OCEAN_START - entityW - 120);
        spawnY = 250 + Math.random() * (MAP_HEIGHT - 500);
      }

      spawnX = Math.max(OCEAN_START + 20, Math.min(MAP_WIDTH - entityW - 20, spawnX));

      entities.push({
        x: spawnX,
        y: spawnY,
        baseSpeed: 2.35,
        speed: 2.35,
        width: entityW,
        height: entityH,
        type: "틸로사우르스",
        species: "틸로사우르스",
        isImmortal: true,
        isTarget: false,
        angle: Math.random() * Math.PI * 2,
        chaseState: "IDLE",
        chaseTimer: 0,
        huntCooldownUntil: 0,
        isResting: false,
        hp: 99999,
        maxHp: 99999
      });
    }

    function startGame() {
      score = 0;
      gameStartTime = Date.now();
      lastUpdateTime = gameStartTime;
      playerHp = MAX_HP;
      playerOxygen = MAX_OXYGEN;
      isGameRunning = true;
      isPausedForHelp = false;
      hasBabySpawned = false;
      entities = [];
      clawEffects = [];
      spermZones = [];
      seaweeds = [];
      player.x = 1650;
      player.y = 1600;
      player.hitCooldown = 0;
      player.clawTimer = 0;
      player.clawCooldown = 0;

      scoreText.innerText = score;
      updateStatusBars();
      startBtn.innerText = "다시 시작";
      startOverlay.style.display = "none";

      initTrees();
      initNests();
      spawnHaastEagleFemale();
      spawnHaastEagleBaby(Math.PI);

      for (let i = 0; i < 85; i++) {
        spawnSeaweed();
      }

      // 🦀 투구게 초기 개체 풍부하게 배치 (강과 바다 양쪽에 암·수 배치)
      const nearCrabCoords = [
        [2050, 1480, "♂"],
        [2250, 1580, "♀"],
        [2120, 1750, "♂"],
        [2320, 1850, "♀"],
        [3550, 1520, "♂"],
        [3750, 1640, "♀"],
        [3900, 1900, "♂"],
        [4100, 2100, "♀"]
      ];
      nearCrabCoords.forEach(([cx, cy, g]) => {
        spawnHorseshoeCrab(g, "ADULT", cx, cy, 40000);
      });

      for (let i = 0; i < 12; i++) {
        const g = i % 2 === 0 ? "♂" : "♀";
        const st = i < 4 ? "BABY" : "ADULT";
        spawnHorseshoeCrab(g, st);
      }

      // 🦕 켈렌불라레 초기 자연 개체
      spawnKelenvolare("♀", false, 1380, 1400, 60000);
      spawnKelenvolare("♂", false, 1460, 1440, 75000);
      spawnKelenvolare("♀", true, 1420, 1480, 0);

      for (let i = 0; i < 7; i++) {
        const g = i % 2 === 0 ? "♀" : "♂";
        const isB = i >= 5;
        spawnKelenvolare(g, isB, null, null, isB ? 0 : (50000 + Math.random() * 45000));
      }

      spawnSpecificPredator("크리욜로포사우르스", 1180, 1350);
      spawnSpecificPredator("하체고프테릭스", 1120, 1820);

      // 🐊 틸로사우르스 초기 배치 (오직 바다 속에만 배치)
      spawnTylosaurus(3850, 1450);
      spawnTylosaurus(4350, 2150);

      for (let i = 0; i < 22; i++) spawnEntity(true);

      if (spawnIntervalId) clearInterval(spawnIntervalId);
      spawnIntervalId = setInterval(() => {
        if (!isGameRunning) return;

        if (seaweeds.length < 95) {
          spawnSeaweed();
          spawnSeaweed();
        }

        // 투구게 개체수 확인 후 부족하면 강과 바다에서 즉시 보충하여 절대 멸종하지 않게 유지
        let crabCount = 0;
        let maleCount = 0;
        let femaleCount = 0;
        for (let i = 0; i < entities.length; i++) {
          if (entities[i].species === "투구게") {
            crabCount++;
            if (entities[i].gender === "♂") maleCount++;
            if (entities[i].gender === "♀") femaleCount++;
          }
        }

        if (crabCount < MIN_HORSESHOE_CRABS) {
          const needGender = maleCount <= femaleCount ? "♂" : "♀";
          spawnHorseshoeCrab(needGender, "ADULT", null, null, 38000);
        }

        if (entities.length < 75) spawnEntity(false);
      }, 900);
    }

    function spawnSpecificPredator(type, px, py) {
      const entityW = type === "하체고프테릭스" ? 280 : 240;
      const entityH = type === "하체고프테릭스" ? 270 : 70;
      entities.push({
        x: px, y: py,
        baseSpeed: 2.3, speed: 2.3,
        width: entityW, height: entityH,
        type: type, species: type, isTarget: false, angle: Math.random() * Math.PI * 2,
        chaseState: "IDLE", chaseTimer: 0, isResting: false, hp: 90, maxHp: 90
      });
    }

    function spawnHaastEagleFemale() {
      entities.push({
        x: player.x - 110 * x, y: player.y,
        baseSpeed: 6.5, speed: 6.5,
        width: 85, height: 70, type: "하스트수리(♀)",
        species: "하스트수리", gender: "♀", isBaby: false, isTarget: false,
        angle: 0, orbitAngle: 0, radiusMultiplier: 110, orbitSpeed: 0.03,
        hp: 9999, maxHp: 9999
      });
    }

    function spawnHaastEagleBaby(startOrbit = Math.PI) {
      entities.push({
        x: player.x + Math.cos(startOrbit) * 75,
        y: player.y + Math.sin(startOrbit) * 75,
        baseSpeed: 6.5, speed: 6.5,
        width: 52, height: 42, type: "하스트수리(새끼)",
        species: "하스트수리", gender: "👶", isBaby: true, isTarget: false,
        angle: 0, orbitAngle: startOrbit, radiusMultiplier: 75, orbitSpeed: 0.04,
        hp: 9999, maxHp: 9999
      });
    }

    function getLandSpawnX(entityWidth) {
      if (Math.random() < 0.65) {
        return Math.random() * (RIVER_START - RIVER_SAND_WIDTH - entityWidth - 150) + 100;
      } else {
        const minX = RIVER_END + RIVER_SAND_WIDTH + 40;
        const maxX = OCEAN_START - OCEAN_SAND_WIDTH - entityWidth - 40;
        return minX + Math.random() * Math.max(100, maxX - minX);
      }
    }

    function spawnKelenvolare(gender, isBaby = false, customX = null, customY = null, initialAgeMs = 0) {
      const w = isBaby ? 64 : 120;
      const h = isBaby ? 48 : 85;

      let spawnX = customX !== null ? customX + (Math.random() * 60 - 30) : getLandSpawnX(w);
      let spawnY = customY !== null ? customY + (Math.random() * 60 - 30) : Math.random() * (MAP_HEIGHT - 400) + 200;

      if (isWaterArea(spawnX, spawnY, w)) {
        spawnX = customX !== null ? customX : getLandSpawnX(w);
      }

      entities.push({
        x: Math.max(50, Math.min(MAP_WIDTH - w - 50, spawnX)),
        y: Math.max(50, Math.min(MAP_HEIGHT - h - 50, spawnY)),
        baseSpeed: isBaby ? 2.1 : 2.9,
        speed: isBaby ? 2.1 : 2.9,
        width: w,
        height: h,
        type: `켈렌불라레(${gender})${isBaby ? ' 새끼' : ''}`,
        species: "켈렌불라레",
        gender: gender,
        isBaby: isBaby,
        isOld: false,
        birthTime: Date.now() - initialAgeMs,
        lastBreedTime: 0,
        fleeUntil: 0,
        isTarget: false,
        angle: Math.random() * Math.PI * 2,
        chaseState: "IDLE", chaseTimer: 0, isResting: false,
        hp: isBaby ? 35 : 80, maxHp: isBaby ? 35 : 80,
        clackTimer: 0
      });
    }

    function spawnEntity(inMap = false) {
      if (!isGameRunning) return;

      let cryoCount = 0;
      let hatzegCount = 0;
      let tyloCount = 0;
      for (let i = 0; i < entities.length; i++) {
        if (entities[i].species === "크리욜로포사우르스") cryoCount++;
        else if (entities[i].species === "하체고프테릭스") hatzegCount++;
        else if (entities[i].species === "틸로사우르스") tyloCount++;
      }

      const rand = Math.random() * 100;
      if (rand < 4 && tyloCount < MAX_TYLOSAURUS) {
        spawnTylosaurus();
        return;
      }

      let type = "로드리게스솔리테어";
      let isTarget = true;

      if (rand < 8 && cryoCount < MAX_CRYOLOPHOSAURUS) {
        type = "크리욜로포사우르스";
        isTarget = false;
      } else if (rand < 11 && hatzegCount < MAX_HATZEGOPTERYX) {
        type = "하체고프테릭스";
        isTarget = false;
      } else if (rand < 41) {
        type = "히네리아";
        isTarget = true;
      } else if (rand < 70) {
        type = "이크티오스테가";
        isTarget = true;
      }

      const sizeMap = {
        "하체고프테릭스": [280, 270],
        "크리욜로포사우르스": [240, 70],
        "히네리아": [120, 50],
        "이크티오스테가": [130, 48],
        "로드리게스솔리테어": [65, 45]
      };
      const [entityW, entityH] = sizeMap[type];

      let spawnX = 1000;
      let spawnY = Math.random() * (MAP_HEIGHT - 400) + 200;

      if (type === "히네리아") {
        if (Math.random() < 0.4) {
          spawnX = Math.random() * (RIVER_END - RIVER_START - entityW - 40) + RIVER_START + 20;
        } else {
          spawnX = Math.random() * (MAP_WIDTH - OCEAN_START - entityW - 100) + OCEAN_START + 50;
        }
      } else if (type === "이크티오스테가") {
        spawnX = Math.random() * (MAP_WIDTH - 400) + 200;
      } else {
        spawnX = getLandSpawnX(entityW);
      }

      const baseSpeed = isTarget ? (1.8 + Math.random() * 1.6) : (2.2 + Math.random() * 1.0);

      entities.push({
        x: spawnX, y: spawnY,
        baseSpeed: baseSpeed, speed: baseSpeed,
        width: entityW, height: entityH,
        type: type, species: type, isTarget: isTarget, angle: Math.random() * Math.PI * 2,
        chaseState: "IDLE", chaseTimer: 0, isResting: false,
        hp: isTarget ? 45 : 90, maxHp: isTarget ? 45 : 90
      });
    }

    function updatePlayer() {
      let dx = 0, dy = 0;

      if (keys["KeyW"] || keys["ArrowUp"]) dy -= 1;
      if (keys["KeyS"] || keys["ArrowDown"]) dy += 1;
      if (keys["KeyA"] || keys["ArrowLeft"]) dx -= 1;
      if (keys["KeyD"] || keys["ArrowRight"]) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        dx /= len;
        dy /= len;
        player.angle = Math.atan2(dy, dx);
      }

      const currentSpeed = player.clawTimer > 0 ? player.speed * 1.9 : player.speed;
      if (player.clawTimer > 0) {
        player.x += Math.cos(player.angle) * currentSpeed;
        player.y += Math.sin(player.angle) * currentSpeed;
      } else {
        player.x += dx * currentSpeed;
        player.y += dy * currentSpeed;
      }

      player.x = Math.max(0, Math.min(MAP_WIDTH - player.width, player.x));
      player.y = Math.max(0, Math.min(MAP_HEIGHT - player.height, player.y));

      if (player.hitCooldown > 0) player.hitCooldown--;
      if (player.clawTimer > 0) player.clawTimer--;
      if (player.clawCooldown > 0) player.clawCooldown--;

      camera.x = Math.max(0, Math.min(MAP_WIDTH - camera.width, player.x + player.width / 2 - camera.width / 2));
      camera.y = Math.max(0, Math.min(MAP_HEIGHT - camera.height, player.y + player.height / 2 - camera.height / 2));
    }

    function checkCollision(r1, r2) {
      return (
        r1.x < r2.x + r2.width &&
        r1.x + r1.width > r2.x &&
        r1.y < r2.y + r2.height &&
        r1.y + r1.height > r2.y
      );
    }

    function updateStatusBars() {
      playerHpBar.style.width = `${(playerHp / MAX_HP) * 100}%`;
      playerOxygenBar.style.width = `${(playerOxygen / MAX_OXYGEN) * 100}%`;
      hpNumText.innerText = Math.ceil(playerHp);
      oxyNumText.innerText = Math.ceil(playerOxygen);
    }

    function update() {
      if (!isGameRunning) return;

      const now = Date.now();
      const dtSec = Math.min(0.1, (now - lastUpdateTime) / 1000);
      lastUpdateTime = now;

      const elapsedSec = Math.floor((now - gameStartTime) / 1000);
      const isNight = (elapsedSec % 120) >= 60;
      timeStateText.innerText = isNight ? "🌙 밤" : "☀️ 낮";

      updatePlayer();

      if (!hasBabySpawned) {
        nests.forEach((nest) => {
          if (checkCollision(player, nest)) {
            hasBabySpawned = true;
            spawnHaastEagleBaby(Math.PI / 2);
            score += 10;
            scoreText.innerText = score;
            playerHp = Math.min(MAX_HP, playerHp + 30);
            playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 30);
          }
        });
      }

      const playerCenterX = player.x + player.width / 2;
      const playerCenterY = player.y + player.height / 2;
      const playerInWater = isWaterArea(playerCenterX, playerCenterY, 0);

      if (playerInWater) {
        terrainText.innerText = isOceanArea(playerCenterX, playerCenterY) ? "🌊 바다" : "🏞️ 강";
        playerOxygen = Math.max(0, playerOxygen - 0.14);
        if (playerOxygen <= 0) {
          playerHp = Math.max(0, playerHp - 0.35);
        }
      } else if (isSandbarArea(playerCenterX, playerCenterY, 0)) {
        terrainText.innerText = "🏖️ 모래톱";
        playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 0.3);
      } else {
        terrainText.innerText = "🌲 숲";
        playerOxygen = Math.min(MAX_OXYGEN, playerOxygen + 0.3);
      }

      if (playerHp <= 0) {
        isGameRunning = false;
        isPausedForHelp = false;
        overlayTitle.innerText = `게임 오버 · ${score}점`;
        startBtn.innerText = "다시 시작";
        startOverlay.style.display = "flex";
      }

      updateStatusBars();

      for (let sIdx = spermZones.length - 1; sIdx >= 0; sIdx--) {
        if (now - spermZones[sIdx].createdAt > 50000) {
          spermZones.splice(sIdx, 1);
        }
      }

      for (let cIdx = clawEffects.length - 1; cIdx >= 0; cIdx--) {
        clawEffects[cIdx].life--;
        if (clawEffects[cIdx].life <= 0) clawEffects.splice(cIdx, 1);
      }

      let currentCrabCount = 0;
      for (let k = 0; k < entities.length; k++) {
        if (entities[k].species === "투구게") currentCrabCount++;
      }

      for (let i = entities.length - 1; i >= 0; i--) {
        const e = entities[i];
        if (!e) continue;

        // 틸로사우르스는 절대 죽지 않음
        if (e.species === "틸로사우르스" || e.isImmortal) {
          e.hp = e.maxHp;
        }

        // 🦀 투구게 일생 주기
        if (e.species === "투구게") {
          const age = now - e.birthTime;

          if (age >= HORSESHOE_LIFESPAN) {
            e.isDead = true;
            entities.splice(i, 1);
            currentCrabCount--;
            continue;
          }

          if (age < 10000) {
            e.stage = "EGG";
            e.width = 24;
            e.height = 24;
            e.speed = 0;
            e.type = "🥚투구게 알";
          } else if (age < 30000) {
            if (e.stage !== "BABY") {
              e.stage = "BABY";
              e.width = 36;
              e.height = 22;
              e.baseSpeed = 1.25;
              e.hp = 30;
              e.maxHp = 30;
            }
            e.type = `투구게(${e.gender}) 새끼`;
          } else {
            if (e.stage !== "ADULT") {
              e.stage = "ADULT";
              e.width = 58;
              e.height = 34;
              e.baseSpeed = 1.65;
              e.hp = 50;
              e.maxHp = 50;
              e.maturity = 0;
            }
            e.maturity = Math.min(100, (e.maturity || 0) + 10 * dtSec);
            e.type = `투구게(${e.gender}) 성숙:${Math.floor(e.maturity)}`;
          }

          if (e.stage !== "EGG") {
            const crabInWater = isWaterArea(e.x, e.y, e.width);
            e.speed = crabInWater ? e.baseSpeed * 1.65 : e.baseSpeed * 0.95;

            e.hunger = Math.max(0, (e.hunger ?? 90) - 0.8 * dtSec);
            if (e.hunger <= 0) {
              e.hp -= 2 * dtSec;
              if (e.hp <= 0) {
                e.isDead = true;
                entities.splice(i, 1);
                currentCrabCount--;
                continue;
              }
            }

            const crabCX = e.x + e.width / 2;
            const crabCY = e.y + e.height / 2;

            for (let swIdx = seaweeds.length - 1; swIdx >= 0; swIdx--) {
              const sw = seaweeds[swIdx];
              if (Math.hypot(crabCX - sw.x, crabCY - sw.y) < e.width * 0.55 + sw.radius) {
                e.hunger = Math.min(100, (e.hunger || 0) + 30);
                seaweeds.splice(swIdx, 1);
                break;
              }
            }
          }

          // 수컷 성체: 모래톱에 올라와 수정액 살포
          if (
            e.gender === "♂" &&
            e.stage === "ADULT" &&
            !e.isDead &&
            (e.hunger || 0) >= 65 &&
            (e.maturity || 0) >= 75 &&
            isSandbarArea(e.x, e.y, e.width) &&
            currentCrabCount < MAX_HORSESHOE_CRABS
          ) {
            if (Math.random() < 0.012 && spermZones.length < 14) {
              spermZones.push({
                x: e.x + e.width / 2,
                y: e.y + e.height / 2,
                radius: 75,
                createdAt: now
              });
            }
          }

          // 암컷 성체: 모래톱의 수정액 근처 도달 시 알 5개 산란
          if (
            e.gender === "♀" &&
            e.stage === "ADULT" &&
            !e.isDead &&
            (e.maturity || 0) >= 85 &&
            (now - (e.lastLayTime || 0) > 18000) &&
            currentCrabCount < MAX_HORSESHOE_CRABS
          ) {
            for (let s = spermZones.length - 1; s >= 0; s--) {
              const sz = spermZones[s];
              const sDist = Math.hypot((e.x + e.width / 2) - sz.x, (e.y + e.height / 2) - sz.y);
              if (sDist <= sz.radius + 45) {
                e.lastLayTime = now;
                spermZones.splice(s, 1);
                const eggCount = 5;
                for (let c = 0; c < eggCount; c++) {
                  const spreadAngle = (Math.PI * 2 * c) / eggCount + Math.random() * 0.2;
                  const spreadDist = 10 + Math.random() * 45;
                  spawnHorseshoeCrab(
                    Math.random() < 0.5 ? "♀" : "♂",
                    "EGG",
                    sz.x + Math.cos(spreadAngle) * spreadDist,
                    sz.y + Math.sin(spreadAngle) * spreadDist,
                    0
                  );
                  currentCrabCount++;
                }
                break;
              }
            }
          }

          if (e.stage === "EGG") continue;
        }

        // 🦕 켈렌불라레 수명 주기
        if (e.species === "켈렌불라레") {
          const age = now - e.birthTime;

          if (age >= KELENVOLARE_LIFESPAN) {
            entities.splice(i, 1);
            continue;
          }

          if (e.isBaby && age >= 45000) {
            e.isBaby = false;
            e.width = 120;
            e.height = 85;
            e.speed = 2.9;
            e.hp = 80;
            e.maxHp = 80;
            e.type = `켈렌불라레(${e.gender})`;
          }

          if (!e.isBaby && !e.isOld && age >= 160000) {
            e.isOld = true;
            e.speed = 2.1;
            e.type = `켈렌불라레(${e.gender}) 노화`;
          }
        }

        const eCenterX = e.x + e.width / 2;
        const eCenterY = e.y + e.height / 2;

        const dx = playerCenterX - eCenterX;
        const dy = playerCenterY - eCenterY;
        const distance = Math.hypot(dx, dy);

        // 아군 하스트수리 (무적인 틸로사우르스는 공격하지 않음)
        if (e.species === "하스트수리" && e !== player) {
          e.orbitAngle = (e.orbitAngle || 0) + (e.orbitSpeed || 0.03);

          const currentRadius = e.radiusMultiplier * x;
          const targetX = playerCenterX + Math.cos(e.orbitAngle) * currentRadius - e.width / 2;
          const targetY = playerCenterY + Math.sin(e.orbitAngle) * currentRadius - e.height / 2;

          e.angle = e.orbitAngle + Math.PI / 2;

          e.x += (targetX - e.x) * 0.15;
          e.y += (targetY - e.y) * 0.15;

          if (e.gender === "♀") {
            for (let j = entities.length - 1; j >= 0; j--) {
              const other = entities[j];
              if (
                other !== e &&
                other.species !== "하스트수리" &&
                other.species !== "켈렌불라레" &&
                other.species !== "틸로사우르스" &&
                !other.isImmortal &&
                other.isTarget === false
              ) {
                if (checkCollision(e, other)) {
                  other.hp -= 1.2;
                  if (other.hp <= 0) {
                    score += 5;
                    scoreText.innerText = score;
                    entities.splice(j, 1);
                    if (j < i) i--;
                  }
                }
              }
            }
          }
          continue;
        }

        // 틸로사우르스는 오직 바다에서만 수영
        if (e.species === "틸로사우르스") {
          e.speed = e.baseSpeed * 1.15;
        }

        // 켈렌불라레 번식
        let isCourting = false;
        if (e.species === "켈렌불라레" && !e.isBaby && now > (e.fleeUntil || 0)) {
          for (let j = 0; j < entities.length; j++) {
            const partner = entities[j];
            if (partner.species === "켈렌불라레" && partner.gender !== e.gender && !partner.isBaby) {
              const kDist = Math.hypot(partner.x - e.x, partner.y - e.y);
              if (kDist < 220 && (now - (e.lastBreedTime || 0) > 10000)) {
                isCourting = true;
                e.angle = Math.atan2(partner.y - e.y, partner.x - e.x);
                e.clackTimer = (e.clackTimer || 0) + 1;
                if (e.clackTimer > 90) {
                  e.clackTimer = 0;
                  e.lastBreedTime = now;
                  partner.lastBreedTime = now;
                  if (e.gender === "♀") {
                    const babyGender = Math.random() < 0.5 ? "♀" : "♂";
                    spawnKelenvolare(babyGender, true, e.x, e.y, 0);
                  }
                }
                break;
              }
            }
          }
        }

        const prevX = e.x;
        const prevY = e.y;

        // 먹이사슬 서열 탐색
        const myRank = FOOD_CHAIN_RANK[e.species] || 0;
        let preyTarget = null;
        let nearestPreyDist = e.species === "틸로사우르스" ? 280 : 280;

        if (myRank > 1) {
          // 틸로사우르스는 한 번 사냥한 후 4.5초 휴식 시간 동안 과도하게 남획하지 않음
          const canHuntNow = !(e.species === "틸로사우르스" && now < (e.huntCooldownUntil || 0));

          if (canHuntNow) {
            for (let k = 0; k < entities.length; k++) {
              const candidate = entities[k];
              if (candidate === e || candidate.species === "하스트수리") continue;
              if (candidate.species === "투구게" && candidate.stage === "EGG") continue;

              // 틸로사우르스는 오로지 바다 속 투구게만 사냥함
              if (e.species === "틸로사우르스") {
                if (candidate.species !== "투구게") continue;
                if (!isStrictlyInOcean(candidate.x, candidate.width)) continue;
              }

              const candRank = FOOD_CHAIN_RANK[candidate.species] || 0;

              if (candRank > 0 && candRank < myRank) {
                const candInWater = isWaterArea(candidate.x, candidate.y, candidate.width);
                if (e.type === "히네리아" && !candInWater) continue;
                if (
                  e.species !== "이크티오스테가" &&
                  e.type !== "하체고프테릭스" &&
                  e.type !== "히네리아" &&
                  e.species !== "틸로사우르스" &&
                  candInWater
                ) continue;

                const pDist = Math.hypot((candidate.x + candidate.width / 2) - eCenterX, (candidate.y + candidate.height / 2) - eCenterY);
                if (pDist < nearestPreyDist) {
                  nearestPreyDist = pDist;
                  preyTarget = candidate;
                }
              }
            }
          }
        }

        // 투구게 번식 행동: 성숙한 수컷/암컷이 모래톱으로 올라와 번식
        let seekSpermZone = null;
        let seekSandbarForBreed = false;
        let seekWaterForGrow = false;

        if (e.species === "투구게" && e.stage !== "EGG") {
          const isReadyMale = (e.gender === "♂" && e.stage === "ADULT" && (e.hunger || 0) >= 65 && (e.maturity || 0) >= 75 && currentCrabCount < MAX_HORSESHOE_CRABS);
          const isReadyFemale = (e.gender === "♀" && e.stage === "ADULT" && (e.maturity || 0) >= 85 && (now - (e.lastLayTime || 0) > 18000) && currentCrabCount < MAX_HORSESHOE_CRABS);

          if (isReadyFemale && spermZones.length > 0) {
            let bestDist = 520;
            spermZones.forEach(sz => {
              const d = Math.hypot(sz.x - eCenterX, sz.y - eCenterY);
              if (d < bestDist) {
                bestDist = d;
                seekSpermZone = sz;
              }
            });
          }

          if ((isReadyMale || isReadyFemale) && !isSandbarArea(e.x, e.y, e.width)) {
            seekSandbarForBreed = true;
          } else if (!isReadyMale && !isReadyFemale && isSandbarArea(e.x, e.y, e.width)) {
            seekWaterForGrow = true;
          }
        }

        // 배고픈 투구게가 해조류 먹이 탐색
        let seekSeaweed = null;
        if (e.species === "투구게" && e.stage !== "EGG" && !seekSandbarForBreed && !seekSpermZone && (e.hunger || 0) < 85 && seaweeds.length > 0) {
          let bestSwDist = 320;
          seaweeds.forEach(sw => {
            const d = Math.hypot(sw.x - eCenterX, sw.y - eCenterY);
            if (d < bestSwDist) {
              bestSwDist = d;
              seekSeaweed = sw;
            }
          });
        }

        if (e.species === "켈렌불라레" && now < (e.fleeUntil || 0)) {
          e.chaseState = "FLEEING";
          e.angle = Math.atan2(-dy, -dx);
          e.x += Math.cos(e.angle) * (e.speed * 1.4);
          e.y += Math.sin(e.angle) * (e.speed * 1.4);
        } else if (!e.isTarget && e.species !== "켈렌불라레" && e.species !== "틸로사우르스" && distance < 420) {
          if (e.chaseState === "IDLE") {
            e.chaseState = "CHASING";
            e.chaseTimer = now;
            e.isResting = false;
          }
          if (!e.isResting) {
            const targetAngle = Math.atan2(dy, dx);
            e.angle = targetAngle;
            e.x += Math.cos(targetAngle) * (e.speed + 1.3);
            e.y += Math.sin(targetAngle) * (e.speed + 1.3);

            if (now - e.chaseTimer > 6000) {
              e.isResting = true;
              e.chaseTimer = now;
            }
          } else if (now - e.chaseTimer > 1200) {
            e.isResting = false;
            e.chaseTimer = now;
          }
        } else if (e.isTarget && e.species !== "투구게" && distance < 150) {
          e.chaseState = "FLEEING";
          e.angle = Math.atan2(-dy, -dx);
          e.x += Math.cos(e.angle) * (e.speed * 1.35);
          e.y += Math.sin(e.angle) * (e.speed * 1.35);
        } else if (seekSpermZone) {
          const sAngle = Math.atan2(seekSpermZone.y - eCenterY, seekSpermZone.x - eCenterX);
          e.angle = sAngle;
          e.x += Math.cos(sAngle) * (e.speed * 1.2);
          e.y += Math.sin(sAngle) * (e.speed * 1.2);
        } else if (seekSandbarForBreed) {
          const targetSandX = getNearestSandbarX(eCenterX);
          const sAngle = Math.atan2(Math.sin(e.angle) * 20, targetSandX - eCenterX);
          e.angle = sAngle;
          e.x += Math.cos(sAngle) * (e.speed * 1.15);
          e.y += Math.sin(sAngle) * (e.speed * 1.15);
        } else if (seekWaterForGrow) {
          const targetWaterX = getNearestWaterX(eCenterX);
          const wAngle = Math.atan2(Math.sin(e.angle) * 20, targetWaterX - eCenterX);
          e.angle = wAngle;
          e.x += Math.cos(wAngle) * (e.speed * 1.15);
          e.y += Math.sin(wAngle) * (e.speed * 1.15);
        } else if (seekSeaweed) {
          const fAngle = Math.atan2(seekSeaweed.y - eCenterY, seekSeaweed.x - eCenterX);
          e.angle = fAngle;
          e.x += Math.cos(fAngle) * (e.speed * 1.15);
          e.y += Math.sin(fAngle) * (e.speed * 1.15);
        } else if (preyTarget && !isCourting) {
          e.chaseState = "HUNTING";
          const preyAngle = Math.atan2(
            (preyTarget.y + preyTarget.height / 2) - eCenterY,
            (preyTarget.x + preyTarget.width / 2) - eCenterX
          );
          e.angle = preyAngle;
          e.x += Math.cos(preyAngle) * (e.speed * 1.2);
          e.y += Math.sin(preyAngle) * (e.speed * 1.2);
        } else {
          e.chaseState = "IDLE";
          e.isResting = false;
          const currentSpeed = isCourting ? e.speed * 0.5 : e.speed;
          if (!isCourting) e.angle += (Math.random() - 0.5) * (Math.PI / 45);
          e.x += Math.cos(e.angle) * currentSpeed;
          e.y += Math.sin(e.angle) * currentSpeed;
        }

        if (e.x <= 0) { e.x = 0; e.angle = Math.PI - e.angle; }
        else if (e.x + e.width >= MAP_WIDTH) { e.x = MAP_WIDTH - e.width; e.angle = Math.PI - e.angle; }
        if (e.y <= 0) { e.y = 0; e.angle = -e.angle; }
        else if (e.y + e.height >= MAP_HEIGHT) { e.y = MAP_HEIGHT - e.height; e.angle = -e.angle; }

        const inWater = isWaterArea(e.x, e.y, e.width);

        if (e.type === "히네리아") {
          if (!inWater) {
            e.x = prevX;
            e.y = prevY;
            e.angle = Math.PI - e.angle + (Math.random() - 0.5) * 0.4;
          }
        } else if (e.species === "투구게") {
          const onWaterOrSand = inWater || isSandbarArea(e.x, e.y, e.width);
          if (!onWaterOrSand) {
            e.x = prevX;
            e.y = prevY;
            e.angle = Math.PI - e.angle + (Math.random() - 0.5) * 0.4;
          }
        } else if (e.species === "틸로사우르스") {
          // 틸로사우르스는 오직 바다(OCEAN_START + 12 이상)에서만 살아가며 육지나 강으로 나가지 못함
          if (e.x < OCEAN_START + 12) {
            e.x = OCEAN_START + 12;
            e.angle = (Math.random() - 0.5) * 0.8;
          }
        } else if (e.species !== "이크티오스테가" && e.type !== "하체고프테릭스") {
          if (inWater) {
            e.x = prevX;
            e.y = prevY;
            e.angle = Math.PI - e.angle + (Math.random() - 0.5) * 0.4;
          }
        }

        // 생물 간 먹이사슬 포식 실행
        if (myRank > 1) {
          for (let j = entities.length - 1; j >= 0; j--) {
            if (j === i) continue;
            const victim = entities[j];
            if (!victim || victim.species === "하스트수리") continue;
            if (victim.species === "투구게" && victim.stage === "EGG") continue;

            // 틸로사우르스는 오로지 바다의 투구게만 잡아먹음
            if (e.species === "틸로사우르스") {
              if (victim.species !== "투구게") continue;
              if (now < (e.huntCooldownUntil || 0)) continue;
              if (!isStrictlyInOcean(victim.x, victim.width)) continue;
            }

            const vRank = FOOD_CHAIN_RANK[victim.species] || 0;

            if (vRank > 0 && vRank < myRank && checkCollision(e, victim)) {
              e.hp = Math.min(e.maxHp, e.hp + 20);
              if (e.species === "틸로사우르스") {
                e.huntCooldownUntil = now + 4500;
              }
              if (victim.species === "투구게") currentCrabCount--;
              entities.splice(j, 1);
              if (j < i) i--;
              break;
            }
          }
        }

        // 플레이어 충돌
        if (checkCollision(player, e)) {
          if (e.species === "투구게" && e.stage === "EGG") continue;

          if (
            !e.isTarget &&
            e.species !== "하스트수리" &&
            e.species !== "켈렌불라레" &&
            e.species !== "틸로사우르스"
          ) {
            if (player.hitCooldown <= 0 && player.clawTimer <= 0) {
              playerHp = Math.max(0, playerHp - 15);
              player.hitCooldown = 30;
              const knockAngle = Math.atan2(playerCenterY - eCenterY, playerCenterX - eCenterX);
              player.x = Math.max(0, Math.min(MAP_WIDTH - player.width, player.x + Math.cos(knockAngle) * 55));
              player.y = Math.max(0, Math.min(MAP_HEIGHT - player.height, player.y + Math.sin(knockAngle) * 55));
            }
          }
        }
      }
    }

    function drawMapBackground() {
      const oceanGrad = ctx.createLinearGradient(OCEAN_START - camera.x, 0, MAP_WIDTH - camera.x, 0);
      oceanGrad.addColorStop(0, "#1d6378");
      oceanGrad.addColorStop(0.4, "#134b5f");
      oceanGrad.addColorStop(1, "#092b38");
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(OCEAN_START - camera.x, 0 - camera.y, MAP_WIDTH - OCEAN_START, MAP_HEIGHT);

      const forestGrad = ctx.createLinearGradient(0 - camera.x, 0, OCEAN_START - camera.x, 0);
      forestGrad.addColorStop(0, "#274725");
      forestGrad.addColorStop(0.5, "#31572c");
      forestGrad.addColorStop(1, "#3b6634");
      ctx.fillStyle = forestGrad;
      ctx.fillRect(0 - camera.x, 0 - camera.y, OCEAN_START, MAP_HEIGHT);

      ctx.fillStyle = "rgba(18, 42, 16, 0.32)";
      for (let i = 100; i < MAP_HEIGHT; i += 280) {
        ctx.beginPath();
        ctx.arc(380 - camera.x, i - camera.y, 130, 0, Math.PI * 2);
        ctx.arc(1350 - camera.x, i + 90 - camera.y, 150, 0, Math.PI * 2);
        ctx.arc(2820 - camera.x, i + 45 - camera.y, 130, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#d9b97e";
      ctx.fillRect(RIVER_START - RIVER_SAND_WIDTH - camera.x, 0 - camera.y, (RIVER_END - RIVER_START) + RIVER_SAND_WIDTH * 2, MAP_HEIGHT);

      const riverGrad = ctx.createLinearGradient(RIVER_START - camera.x, 0, RIVER_END - camera.x, 0);
      riverGrad.addColorStop(0, "#1f6694");
      riverGrad.addColorStop(0.5, "#2980b9");
      riverGrad.addColorStop(1, "#1f6694");
      ctx.fillStyle = riverGrad;
      ctx.fillRect(RIVER_START - camera.x, 0 - camera.y, RIVER_END - RIVER_START, MAP_HEIGHT);

      ctx.fillStyle = "#d9b97e";
      ctx.fillRect(OCEAN_START - OCEAN_SAND_WIDTH - camera.x, 0 - camera.y, OCEAN_SAND_WIDTH, MAP_HEIGHT);
    }

    function drawSeaweeds() {
      const t = Date.now() / 500;
      seaweeds.forEach((sw) => {
        const sx = sw.x - camera.x;
        const sy = sw.y - camera.y;
        if (sx < -50 || sx > camera.width + 50 || sy < -50 || sy > camera.height + 50) return;

        const sway = Math.sin(t + sw.swayOffset) * 3.5;

        ctx.lineWidth = 3.2;
        ctx.lineCap = "round";

        [-5, 0, 5].forEach((offsetX, idx) => {
          ctx.strokeStyle = idx === 1 ? "#27ae60" : "#55efc4";
          ctx.beginPath();
          ctx.moveTo(sx + offsetX, sy + 8);
          ctx.quadraticCurveTo(sx + offsetX + sway, sy, sx + offsetX - sway * 0.8, sy - 10);
          ctx.stroke();
        });
      });
    }

    function drawSpermZones() {
      const pulse = Math.sin(Date.now() / 350) * 4;
      spermZones.forEach((sz) => {
        const sx = sz.x - camera.x;
        const sy = sz.y - camera.y;
        if (sx < -120 || sx > camera.width + 120 || sy < -120 || sy > camera.height + 120) return;

        const r = sz.radius + pulse;
        const grad = ctx.createRadialGradient(sx, sy, 5, sx, sy, r);
        grad.addColorStop(0, "rgba(255, 255, 255, 0.95)");
        grad.addColorStop(0.55, "rgba(215, 245, 255, 0.65)");
        grad.addColorStop(1, "rgba(180, 235, 255, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.arc(sx, sy, r * 0.72, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = "700 12px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "rgba(0, 0, 0, 0.65)";
        ctx.lineWidth = 3;
        ctx.strokeText("✨수정액", sx - 24, sy - r * 0.5);
        ctx.fillText("✨수정액", sx - 24, sy - r * 0.5);
      });
    }

    function drawTrees() {
      trees.forEach((tree) => {
        const tx = tree.x - camera.x;
        const ty = tree.y - camera.y;
        const s = tree.scale;

        if (tx < -120 || tx > camera.width + 120 || ty < -160 || ty > camera.height + 80) return;

        ctx.fillStyle = "rgba(8, 20, 8, 0.35)";
        ctx.beginPath();
        ctx.ellipse(tx, ty + 4 * s, 34 * s, 13 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#5c3a21";
        ctx.beginPath();
        ctx.moveTo(tx - 11 * s, ty + 3 * s);
        ctx.lineTo(tx - 7 * s, ty - 48 * s);
        ctx.lineTo(tx + 7 * s, ty - 48 * s);
        ctx.lineTo(tx + 11 * s, ty + 3 * s);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#3e2615";
        ctx.beginPath();
        ctx.moveTo(tx + 1 * s, ty + 3 * s);
        ctx.lineTo(tx + 1 * s, ty - 48 * s);
        ctx.lineTo(tx + 7 * s, ty - 48 * s);
        ctx.lineTo(tx + 11 * s, ty + 3 * s);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#133a18";
        ctx.beginPath();
        ctx.arc(tx - 18 * s, ty - 52 * s, 24 * s, 0, Math.PI * 2);
        ctx.arc(tx + 18 * s, ty - 52 * s, 24 * s, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#1b4d20";
        ctx.beginPath();
        ctx.arc(tx - 12 * s, ty - 66 * s, 26 * s, 0, Math.PI * 2);
        ctx.arc(tx + 12 * s, ty - 66 * s, 26 * s, 0, Math.PI * 2);
        ctx.arc(tx, ty - 54 * s, 27 * s, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#236029";
        ctx.beginPath();
        ctx.arc(tx, ty - 80 * s, 24 * s, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawNests() {
      nests.forEach((nest) => {
        const nx = nest.x - camera.x;
        const ny = nest.y - camera.y;
        ctx.fillStyle = "#7a5c4e";
        ctx.beginPath();
        ctx.ellipse(nx, ny, 35, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        if (nest.hasEgg) {
          ctx.fillStyle = nest.eggState === "FERTILIZED" ? "#2ecc71" : "#fff8e1";
          ctx.beginPath();
          ctx.ellipse(nx - 6, ny - 2, 8, 11, 0, 0, Math.PI * 2);
          ctx.ellipse(nx + 6, ny - 2, 8, 11, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function drawTylosaurus(w, h, state) {
      const isHunting = state === "HUNTING";
      const swimWave = Math.sin(Date.now() / 160) * (h * 0.08);

      const tailGrad = ctx.createLinearGradient(-w * 0.54, 0, -w * 0.05, 0);
      tailGrad.addColorStop(0, "#7f96a8");
      tailGrad.addColorStop(0.5, "#60788c");
      tailGrad.addColorStop(1, "#4e6578");

      ctx.fillStyle = tailGrad;
      ctx.beginPath();
      ctx.moveTo(-w * 0.08, -h * 0.18);
      ctx.bezierCurveTo(-w * 0.25, -h * 0.22 + swimWave, -w * 0.42, -h * 0.26 - swimWave, -w * 0.54, -h * 0.08 + swimWave);
      ctx.quadraticCurveTo(-w * 0.58, swimWave, -w * 0.54, h * 0.12 + swimWave);
      ctx.bezierCurveTo(-w * 0.40, h * 0.22 - swimWave, -w * 0.24, h * 0.18 + swimWave, -w * 0.08, h * 0.18);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "rgba(44, 62, 80, 0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-w * 0.12, 0);
      ctx.quadraticCurveTo(-w * 0.34, swimWave * 0.8, -w * 0.52, swimWave);
      ctx.stroke();

      ctx.fillStyle = "#5c7387";
      ctx.strokeStyle = "#3b4d5c";
      ctx.lineWidth = 1.2;

      ctx.beginPath();
      ctx.ellipse(w * 0.10, -h * 0.34, w * 0.068, h * 0.21, -0.45, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(w * 0.10, h * 0.34, w * 0.068, h * 0.21, 0.45, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-w * 0.14, -h * 0.28, w * 0.052, h * 0.16, -0.5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(-w * 0.14, h * 0.28, w * 0.052, h * 0.16, 0.5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      const bodyGrad = ctx.createLinearGradient(0, -h * 0.28, 0, h * 0.28);
      bodyGrad.addColorStop(0, "#4c6375");
      bodyGrad.addColorStop(0.5, "#8da3b5");
      bodyGrad.addColorStop(1, "#dce6ed");

      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.23, h * 0.27, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(42, 58, 72, 0.35)";
      [-0.22, -0.11, 0.0, 0.10].forEach((pos, idx) => {
        ctx.beginPath();
        ctx.ellipse(w * pos, 0, w * 0.025, h * (0.14 + (idx % 2) * 0.04), 0, 0, Math.PI * 2);
        ctx.fill();
      });

      if (isHunting) {
        ctx.fillStyle = "#8e2424";
        ctx.beginPath();
        ctx.moveTo(w * 0.22, -h * 0.15);
        ctx.lineTo(w * 0.48, -h * 0.04);
        ctx.lineTo(w * 0.48, h * 0.04);
        ctx.lineTo(w * 0.22, h * 0.15);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#f8f9fa";
        for (let t = 0.25; t <= 0.45; t += 0.035) {
          ctx.beginPath();
          ctx.arc(w * t, -h * (0.14 - (t - 0.22) * 0.38), 1.6, 0, Math.PI * 2);

      }

      ctx.fillStyle = "#526a7d";

      ctx.moveTo(w * 0.17, -h * 0.19);

      ctx.lineTo(w * 0.08, -h * 0.47);
      ctx.quadraticCurveTo(w * 0.50, -h * 0.45, w * 0.50, 0);
      ctx.quadraticCurveTo(w * 0.50, h * 0.45, w * 0.08, h * 0.47);
      ctx.lineTo(w * 0.00, h * 0.45);
      ctx.lineTo(w * 0.06, h * 0.33);
      ctx.lineTo(w * 0.06, -h * 0.33);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#4a3319";
      ctx.beginPath();
      ctx.arc(w * 0.27, -h * 0.22, stage === "BABY" ? 1.5 : 2.0, 0, Math.PI * 2);
      ctx.arc(w * 0.27, h * 0.22, stage === "BABY" ? 1.5 : 2.0, 0, Math.PI * 2);

    function drawCryolophosaurus(w, h, state) {
      const isAlert = state === "CHASING" || state === "HUNTING";

      const stripeColor = isAlert ? "#4a2c11" : "#3d2b1f";

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.moveTo(-w * 0.05, -h * 0.15);
      ctx.quadraticCurveTo(-w * 0.35, -h * 0.09, -w * 0.65, 0);

      ctx.beginPath();
      ctx.ellipse(-w * 0.08, -h * 0.18, w * 0.09, h * 0.16, -0.2, 0, Math.PI * 2);

      ctx.lineTo(w * 0.12, h * 0.13);
      ctx.closePath();

      ctx.fillStyle = stripeColor;
      const stripePositions = [-0.52, -0.42, -0.32, -0.22, -0.12, -0.02, 0.08, 0.18];
      stripePositions.forEach((pos, idx) => {
        const sw = w * 0.022;
        const sh = idx < 4 ? h * (0.07 + idx * 0.02) : h * 0.28;
        ctx.beginPath();
        ctx.ellipse(w * pos, 0, sw, sh, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.moveTo(w * 0.24, -h * 0.15);
      ctx.quadraticCurveTo(w * 0.42, -h * 0.14, w * 0.44, 0);
      ctx.quadraticCurveTo(w * 0.42, h * 0.14, w * 0.24, h * 0.15);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#5d7687";

      ctx.arc(w * 0.29, -h * 0.11, h * 0.055, 0, Math.PI * 2);

      ctx.beginPath();
      ctx.ellipse(w * 0.26, -h * 0.12, w * 0.012, h * 0.05, 0, 0, Math.PI * 2);

      ctx.beginPath();

      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = isOld ? "#a68a73" : "#8b4513";

      ctx.quadraticCurveTo(-w * 0.05, -h * 0.35, -w * 0.08, -h * 0.1);

      ctx.beginPath();
      ctx.moveTo(-w * 0.08, h * 0.1);
      ctx.quadraticCurveTo(-w * 0.48, h * 0.9, w * 0.15, h * 0.7);
      ctx.quadraticCurveTo(-w * 0.05, h * 0.35, -w * 0.08, h * 0.1);

      ctx.fillStyle = isOld ? "#6b5f58" : "#362a24";

      const offset = (clackTimer % 4 > 2) ? 4 : 0;
      ctx.fillStyle = isOld ? "#e0d8b8" : "#d4c585";
      ctx.beginPath();
      ctx.moveTo(w * 0.26, -h * 0.1 - offset); ctx.lineTo(w * 0.55, 0); ctx.lineTo(w * 0.26, h * 0.1 + offset);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#2c2a29";
      ctx.beginPath();

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMapBackground();
      drawSeaweeds();
      drawSpermZones();
      drawNests();

      clawEffects.forEach((c) => {
        const alpha = c.life / c.maxLife;
        ctx.save();
        ctx.translate(c.x - camera.x, c.y - camera.y);
        ctx.rotate(c.angle);
        ctx.strokeStyle = `rgba(255, 220, 100, ${alpha})`;
        ctx.lineWidth = 4;
        for (let line = -1; line <= 1; line++) {
          ctx.beginPath();
          ctx.arc(0, line * 14, 32, -0.7, 0.7);
          ctx.stroke();
        }
        ctx.restore();
      });

      entities.forEach((e) => {
        if (e.species === "하스트수리") return;
        if (
          e.x + e.width > camera.x && e.x < camera.x + camera.width &&
          e.y + e.height > camera.y && e.y < camera.y + camera.height
        ) {
          const screenX = e.x + e.width / 2 - camera.x;
          const screenY = e.y + e.height / 2 - camera.y;

          ctx.save();
          ctx.translate(screenX, screenY);
          ctx.rotate(e.angle);

          if (e.species === "켈렌불라레") drawKelenvolare(e.width, e.height, e.clackTimer, e.isBaby, e.isOld);
          else if (e.type === "크리욜로포사우르스") drawCryolophosaurus(e.width, e.height, e.chaseState);
          else if (e.type === "하체고프테릭스") drawHatzegopteryx(e.width, e.height, e.chaseState);
          else if (e.species === "틸로사우르스") drawTylosaurus(e.width, e.height, e.chaseState);
          else if (e.type === "로드리게스솔리테어") drawSolitaire(e.width, e.height);
          else if (e.type === "히네리아") drawHyneria(e.width, e.height);
          else if (e.type === "이크티오스테가") drawIchthyostega(e.width, e.height);
          else if (e.species === "투구게") drawHorseshoeCrab(e.width, e.height, e.stage);

          ctx.restore();

          // 무적인 틸로사우르스와 알은 체력바 숨김
          if (!(e.species === "투구게" && e.stage === "EGG") && !e.isImmortal) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
            ctx.fillRect(screenX - 24, screenY - e.height / 2 - 14, 48, 4);
            ctx.fillStyle = (e.isTarget || e.species === "켈렌불라레") ? "#2ecc71" : "#ff4757";
            ctx.fillRect(screenX - 24, screenY - e.height / 2 - 14, (e.hp / e.maxHp) * 48, 4);
          }

          ctx.font = "600 12px sans-serif";
          if (e.species === "켈렌불라레") {
            ctx.fillStyle = e.isBaby ? "#7bed9f" : (e.isOld ? "#ced6e0" : "#2ecc71");
          } else if (e.species === "투구게") {
            ctx.fillStyle = e.stage === "EGG" ? "#0984e3" : (e.stage === "BABY" ? "#f8c291" : "#ffeaa7");
          } else if (e.species === "틸로사우르스") {
            ctx.fillStyle = "#85c1e9";
          } else if (!e.isTarget) {
            ctx.fillStyle = e.chaseState === "CHASING" ? "#ff6b6b" : "#ffa502";
          } else {
            ctx.fillStyle = "#f1f2f6";
          }
          ctx.fillText(`${e.type}`, screenX - 32, screenY - e.height / 2 - 18);
        }
      });

      drawTrees();

      entities.forEach((e) => {
        if (e.species !== "하스트수리") return;
        const screenX = e.x + e.width / 2 - camera.x;
        const screenY = e.y + e.height / 2 - camera.y;

        ctx.save();
        ctx.translate(screenX, screenY);
        ctx.rotate(e.angle);
        drawHaastEagle(e.width, e.height, e.isBaby);
        ctx.restore();

        ctx.font = "600 12px sans-serif";
        ctx.fillStyle = e.isBaby ? "#ffeaa7" : "#ff79c6";
        ctx.fillText(`${e.type}`, screenX - 30, screenY - e.height / 2 - 14);
      });

      if (player.hitCooldown % 4 < 2) {
        ctx.save();
        ctx.translate(player.x + player.width / 2 - camera.x, player.y + player.height / 2 - camera.y);
        ctx.rotate(player.angle);
        drawHaastEagle(player.width, player.height, false);
        ctx.restore();
      }

      const elapsedSec = Math.floor((Date.now() - gameStartTime) / 1000);
      const isNight = (elapsedSec % 120) >= 60;

      if (isNight) {
        ctx.save();
        ctx.fillStyle = "rgba(10, 15, 35, 0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const pScreenX = player.x + player.width / 2 - camera.x;
        const pScreenY = player.y + player.height / 2 - camera.y;

        const lightGrad = ctx.createRadialGradient(pScreenX, pScreenY, 30, pScreenX, pScreenY, 240);
        lightGrad.addColorStop(0, "rgba(255, 240, 200, 0.25)");
        lightGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = lightGrad;
        ctx.beginPath();
        ctx.arc(pScreenX, pScreenY, 240, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
